---
# Chatterbox TTS Server (https://github.com/devnen/Chatterbox-TTS-Server)
# Deployed as a Docker Compose service built from a git checkout.
#
# project_root and docker_compose_profiles are defined in group_vars and the
# openwebui_stack role; they are only declared here as fallbacks for
# standalone use of this role.

# gpu -> Dockerfile (CUDA, RUNTIME=nvidia). cpu -> Dockerfile.cpu.
chatterbox_device: gpu

chatterbox_repo: https://github.com/devnen/Chatterbox-TTS-Server.git

# Pin the upstream commit/tag for reproducible builds. `main` tracks latest.
chatterbox_version: main

chatterbox_port: 8004

# The API can need several minutes: first boot downloads models to hf_cache.
chatterbox_compose_wait_timeout: 900

chatterbox_api_wait_retries: 30

chatterbox_default_voice_id: Emily.wav

# Open WebUI TTS wiring rendered into .env (env.j2 reads these).
# CHATTERBOX_TTS_MODEL: the Open WebUI model name (kept tts-1 for the
# OpenAI-compatible endpoint). CHATTERBOX_TTS_VOICE: voice library name;
# empty uses the built-in sample.
chatterbox_tts_model: tts-1
chatterbox_tts_voice: ""

# Maximum reference-clip duration (seconds) accepted by the voice-clone
# upload endpoint. Longer clips are rejected by validation and deleted.
chatterbox_max_reference_duration_sec: 60

# Engine repo id: chatterbox-turbo, chatterbox-multilingual, or the original
# English chatterbox model (chatterbox).
chatterbox_tts_engine: chatterbox-turbo

project_root: /mnt/data1/openwebui-stack

docker_compose_profiles:
  - monitoring
