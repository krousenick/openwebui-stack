---
- name: Create application client
  middleware_automation.keycloak.keycloak_client:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_realm: "{{ keycloak_realm }}"
    auth_client_id: "{{ keycloak_provisioner_client_id }}"
    auth_client_secret: "{{ keycloak_provisioner_client_secret }}"
    realm: "{{ keycloak_realm }}"

    client_id: "{{ app.client_id }}"
    name: "{{ app.name }}"

    protocol: openid-connect
    enabled: true

    public_client: false

    standard_flow_enabled: true
    implicit_flow_enabled: false
    direct_access_grants_enabled: false
    service_accounts_enabled: false

    full_scope_allowed: false
    consent_required: false
    secret: "{{ app.client_secret }}"

    root_url: "{{ app.base_url }}"
    base_url: "{{ app.base_url }}"

    redirect_uris: "{{ app.redirect_uris }}"
    web_origins:
      - "{{ app.base_url }}"
    # Single logout, per-app in vars.yml keycloak_apps. Keycloak stores these
    # as the post.logout.redirect.uris client attribute and rejects the
    # post_logout_redirect_uri of an RP-initiated logout that is not listed.
    # Omitting the key keeps the module from touching the attribute (None
    # params are skipped).
    valid_post_logout_redirect_uris: "{{ app.post_logout_redirect_uris | default(omit) }}"
    # Keycloak only POSTs the back-channel logout token to clients with
    # front-channel logout off; a client with it on is skipped.
    frontchannel_logout: false

    # backchannel.logout.* is added only for apps that declare
    # backchannel_logout_url. session.required puts the sid claim in the
    # logout token next to sub.
    attributes: >-
      {{ {
        'pkce.code.challenge.method': 'S256' if (app.pkce | default(true) | bool) else ''
      } | combine({
        'backchannel.logout.url': app.backchannel_logout_url,
        'backchannel.logout.session.required': 'true'
      } if app.backchannel_logout_url is defined else {}) }}

    state: present
    validate_certs: "{{ keycloak_validate_certs }}"
  delegate_to: localhost

- name: Create application roles
  middleware_automation.keycloak.keycloak_role:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_realm: "{{ keycloak_realm }}"
    auth_client_id: "{{ keycloak_provisioner_client_id }}"
    auth_client_secret: "{{ keycloak_provisioner_client_secret }}"
    realm: "{{ keycloak_realm }}"

    client_id: "{{ app.client_id }}"
    name: "{{ item }}"
    description: "{{ app.name }} application role: {{ item }}"

    state: present
    validate_certs: "{{ keycloak_validate_certs }}"
  loop: "{{ app.roles }}"
  delegate_to: localhost

- name: Create dedicated client scope
  middleware_automation.keycloak.keycloak_client_scope:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_realm: "{{ keycloak_realm }}"
    auth_client_id: "{{ keycloak_provisioner_client_id }}"
    auth_client_secret: "{{ keycloak_provisioner_client_secret }}"

    realm: "{{ keycloak_realm }}"

    name: "{{ app.client_id }}-dedicated"
    description: "Dedicated OIDC scope for {{ app.name }}"
    protocol: openid-connect

    attributes:
      include.in.token.scope: "false"
      display.on.consent.screen: "false"

    protocol_mappers: >-
      {{ ([
        {
          'name': 'groups',
          'protocol': 'openid-connect',
          'protocolMapper': 'oidc-group-membership-mapper',
          'config': {
            'full.path': 'false',
            'claim.name': 'groups',
            'id.token.claim': 'true',
            'access.token.claim': 'true',
            'userinfo.token.claim': 'true'
          }
        }
      ] if app.include_groups | default(false) else []) + [
        {
          'name': 'application-roles',
          'protocol': 'openid-connect',
          'protocolMapper': 'oidc-usermodel-client-role-mapper',
          'config': {
            'client.id': app.client_id,
            'user.attribute': '',
            'claim.name': 'roles',
            'jsonType.label': 'String',
            'multivalued': 'true',
            'id.token.claim': 'true',
            'access.token.claim': 'true',
            'userinfo.token.claim': 'true'
          }
        }
      ] }}

    state: present
    validate_certs: "{{ keycloak_validate_certs }}"
  delegate_to: localhost

- name: Map application roles into dedicated scope
  middleware_automation.keycloak.keycloak_client_scope_rolemappings:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_realm: "{{ keycloak_realm }}"
    auth_client_id: "{{ keycloak_provisioner_client_id }}"
    auth_client_secret: "{{ keycloak_provisioner_client_secret }}"

    realm: "{{ keycloak_realm }}"
    client_id: "{{ app.client_id }}"
    client_scope_id: "{{ app.client_id }}-dedicated"

    role_names: "{{ app.roles }}"

    state: present
    validate_certs: "{{ keycloak_validate_certs }}"
  delegate_to: localhost

- name: Attach dedicated client scope
  middleware_automation.keycloak.keycloak_client_scope_type:
    auth_keycloak_url: "{{ keycloak_url }}"
    auth_realm: "{{ keycloak_realm }}"
    auth_client_id: "{{ keycloak_provisioner_client_id }}"
    auth_client_secret: "{{ keycloak_provisioner_client_secret }}"

    realm: "{{ keycloak_realm }}"
    client_id: "{{ app.client_id }}"

    default_client_scopes:
      - basic
      - email
      - profile
      - roles
      - web-origins
      - "{{ app.client_id }}-dedicated"

    validate_certs: "{{ keycloak_validate_certs }}"
  delegate_to: localhost
