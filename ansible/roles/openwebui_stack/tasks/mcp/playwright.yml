---
# Playwright MCP cluster: headless Chromium automation behind Traefik.
# The containers, Traefik labels (mcp entrypoint, sticky cookies), and the
# LiteLLM mcp_servers entry live in docker-compose.yml and litellm/config.yaml;
# this task wires the Open WebUI client-side tool server connection so models
# can use the playwright_cluster tools in chat.

- name: Require Playwright MCP settings
  ansible.builtin.assert:
    that:
      - litellm_master_key | length > 0
      - openwebui_db_user | length > 0
      - openwebui_db_password | length > 0
      - openwebui_db_name | length > 0
    fail_msg: "Playwright MCP requires the LiteLLM key and Open WebUI database settings."

- name: Read current Open WebUI tool server connections
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - PGPASSWORD={{ openwebui_db_password }}
      - "{{ compose_project_name }}_postgres"
      - psql
      - -U
      - "{{ openwebui_db_user }}"
      - -d
      - "{{ openwebui_db_name }}"
      - -tAc
      - SELECT value::text FROM config WHERE key = 'tool_server.connections'
  register: playwright_tool_server_current
  changed_when: false
  no_log: true

- name: Merge the Playwright connection into the desired tool server list
  ansible.builtin.set_fact:
    # Keep existing connections (Brave, anything added later) and append the
    # Playwright entry only when it is not already present, matching by info.id.
    playwright_tool_server_desired: >-
      {{ (playwright_tool_server_current.stdout | trim | default('[]') | from_json)
         | selectattr('info.id', 'defined')
         | rejectattr('info.id', 'equalto', 'playwright_cluster')
         | list
         | union([playwright_connection]) }}
    playwright_connection:
      - type: mcp
        url: http://litellm:4000/mcp/playwright_cluster
        path: ""
        auth_type: bearer
        key: "{{ litellm_master_key }}"
        config:
          enable: true
        info:
          id: playwright_cluster
          name: Playwright MCP
          description: Browser automation through the LiteLLM Playwright MCP cluster
  no_log: true

- name: Update persisted Playwright MCP configuration
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - PGPASSWORD={{ openwebui_db_password }}
      - "{{ compose_project_name }}_postgres"
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -U
      - "{{ openwebui_db_user }}"
      - -d
      - "{{ openwebui_db_name }}"
    args:
      stdin: |
        UPDATE config SET value = '{{ playwright_tool_server_desired | to_json | replace("'", "''") }}'::json, updated_at = (extract(epoch from now())*1000)::bigint WHERE key = 'tool_server.connections';
  register: playwright_config_update
  changed_when: >-
    (playwright_tool_server_current.stdout | trim | default('') )
    != (playwright_tool_server_desired | to_json)
  no_log: true

- name: Recreate Playwright-enabled services
  community.docker.docker_compose_v2:
    project_src: "{{ project_root }}"
    files:
      - docker-compose.yml
    profiles: "{{ docker_compose_profiles }}"
    services:
      - playwright-mcp
      - litellm
      - open-webui
    state: present
    recreate: always
    wait: true
    wait_timeout: 180
  when: playwright_config_update is changed
