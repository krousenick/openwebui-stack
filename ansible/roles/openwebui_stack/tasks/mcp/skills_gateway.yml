---
# Skills Gateway: register the skills shipped in ./skills (SKILL.md
# packages) with LiteLLM's proxy-hosted skill store and the Claude Code
# marketplace (https://docs.litellm.ai/docs/skills_gateway).
#
# Two stores are involved:
#   1. The skill content: uploaded as a zip to /v1/skills with
#      custom_llm_provider=litellm_proxy (stored in the proxy's Postgres),
#      so any agent that speaks the Skills API can fetch it and semantic
#      skill search can rank it (litellm_settings.skill_search_embedding_model).
#      The store is create/delete only: POST /v1/skills always mints a new
#      skill id; there is no update endpoint. A changed SKILL.md is
#      therefore deleted and re-uploaded.
#   2. The registry entry: the Claude Code marketplace
#      (POST /claude-code/plugins, PUT .../{name} for updates, 404 = create).
#      The entry's archive source points at the proxy's own
#      /v1/skills/{skill_id}/archive so the zip never leaves the network.
#      Sources must be https (_validate_plugin_source), hence the public
#      litellm.<domain> URL for what is the same served archive.
#
# Idempotency: each skill is matched in the store by display_title (the
# SKILL.md frontmatter name). The stored archive's sha256 (published in
# the Agent Skills index) is compared with the deterministic digest of
# the checkout's SKILL.md; a byte-identical skill is left untouched,
# drift triggers delete + re-upload + registry PUT. Digest comparison
# needs the discovery index (public_skills_index); without it, stored
# skills are assumed unchanged and only missing ones are uploaded.
#
# Only SKILL.md is published: the upload zip and the digest hold that one
# file, and Open WebUI stores a skill as a single document. A skill must
# therefore be self-contained; files beside SKILL.md (references/,
# scripts/) reach opencode only, through its directory copy.

- name: Require Skills Gateway settings
  ansible.builtin.assert:
    that:
      - litellm_master_key | length > 0
    fail_msg: "Skills Gateway requires the LiteLLM master key."

- name: Stage the skill packages on the deployment host
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../skills/"
    dest: "{{ project_root }}/skills/"
    mode: "0644"
  when: hostvars[inventory_hostname].ansible_connection | default('ssh') != 'local'

- name: Find skill packages
  ansible.builtin.find:
    paths: "{{ project_root }}/skills"
    file_type: directory
  register: skills_gateway_dirs

- name: Build the desired skill list
  ansible.builtin.set_fact:
    skills_gateway_desired: >-
      {{ skills_gateway_dirs.files | map(attribute='path') | map('basename') | list }}
  no_log: true

- name: Read each skill's frontmatter name and description
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import re, sys, pathlib
        text = pathlib.Path(sys.argv[1]).read_text()
        match = re.search(r'(?ms)^---\s*\n(.*?)\n---\s*\n', text)
        if not match:
            sys.exit(1)
        fm = match.group(1)
        name = re.search(r'^name:[ \t]*(.*?)[ \t\r]*$', fm, re.M)
        desc = re.search(r'^description:\s*(.+)$', fm, re.M)
        if not name or not name.group(1):
            sys.exit(1)
        description = ' '.join(desc.group(1).split()) if desc else ''
        if description.startswith('>-'):
            block = re.search(r'^description:\s*>-\s*\n((?:\s+.+\n?)+)', fm, re.M)
            description = ' '.join(line.strip() for line in block.group(1).splitlines()) if block else ''
        print(name.group(1).strip('"').strip("'"))
        print(description)
      - /app/skills/{{ item }}/SKILL.md
  loop: "{{ skills_gateway_desired }}"
  register: skills_gateway_frontmatter
  changed_when: false
  no_log: true

- name: Assemble per-skill metadata facts
  ansible.builtin.set_fact:
    skills_gateway_skills: >-
      {{ skills_gateway_skills | default([])
         + [{'package': item.0,
             'name': (item.1.stdout_lines[0] | default('')),
             'description': ((item.1.stdout_lines[1:] | default([])) | join(' '))}] }}
  loop: "{{ skills_gateway_desired | zip(skills_gateway_frontmatter.results) | list }}"
  no_log: true

- name: Validate each skill's frontmatter
  # The frontmatter name is the key in every consumer: the store's
  # display_title, the marketplace entry, the discovery index, and the
  # Open WebUI skill id. It must be the package directory name; a display
  # title such as "Deep Research Protocol (DRP)" would register a second,
  # differently named skill and never match the index digest.
  ansible.builtin.assert:
    that:
      - item.name == item.package
      - item.name is match('^[a-z0-9]+(-[a-z0-9]+)*$')
      - item.name | length <= 64
      - item.description | length > 0
      - item.description | length <= 1024
    fail_msg: >-
      skills/{{ item.package }}/SKILL.md: frontmatter name
      '{{ item.name }}' must equal the directory name as a lowercase
      hyphenated slug (64 characters at most), and description must be
      1-1024 characters (found {{ item.description | length }}).
    quiet: true
  loop: "{{ skills_gateway_skills }}"
  loop_control:
    label: "{{ item.package }}"

- name: Compute each skill archive's deterministic sha256
  # Two artifacts per skill:
  #   - the upload zip (/tmp/<name>.zip): Anthropic Skills API layout,
  #     SKILL.md inside a top-level folder named after the skill.
  #   - the expected index digest (printed): what the proxy's
  #     build_skill_archive repack will produce from that upload — the
  #     discovery index digests the repacked archive, not the upload zip.
  #     Repack rules mirrored here: skill folder stripped to a root
  #     SKILL.md, fixed 1980 mtimes, mode 0644, create_system=3, DEFLATE.
  #     Identical SKILL.md bytes hash identically on every machine.
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - bash
      - -c
      - >-
        cd /app && python3 -c
        "import zipfile, sys, hashlib, io; skill = open('skills/' + sys.argv[2] + '/SKILL.md', 'rb').read(); info = zipfile.ZipInfo(filename='SKILL.md', date_time=(1980, 1, 1, 0, 0, 0)); info.create_system = 3; info.external_attr = 0o644 << 16; buf = io.BytesIO(); z = zipfile.ZipFile(buf, 'w'); z.writestr(info, skill, compress_type=zipfile.ZIP_DEFLATED); z.close(); print(hashlib.sha256(buf.getvalue()).hexdigest()); z = zipfile.ZipFile(sys.argv[1], 'w'); z.writestr(sys.argv[2] + '/SKILL.md', skill); z.close()"
        /tmp/{{ item.name }}.zip {{ item.package }}
  loop: "{{ skills_gateway_skills }}"
  register: skills_gateway_hashes
  changed_when: false
  no_log: true

- name: Record the desired archive digests
  ansible.builtin.set_fact:
    skills_gateway_digests: >-
      {{ skills_gateway_digests | default({})
         | combine({item.0.name: item.1.stdout | trim}) }}
  loop: "{{ skills_gateway_skills | zip(skills_gateway_hashes.results) | list }}"
  no_log: true

- name: Read the Agent Skills discovery index for stored digests
  # The index lists every stored skill with the sha256 of its served
  # archive. It 404s while public_skills_index is off; in that case there
  # is no digest source, stored_digests stays empty, and the drift check
  # below conservatively treats every already-stored skill as unchanged
  # (no delete/re-upload churn) while still uploading missing skills.
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import urllib.request, urllib.error
        try:
            print(urllib.request.urlopen('http://localhost:4000/.well-known/agent-skills/index.json').read().decode())
        except urllib.error.HTTPError as error:
            print('')
  register: skills_gateway_index
  changed_when: false
  failed_when: false
  no_log: true

- name: Record whether the discovery index is available
  ansible.builtin.set_fact:
    skills_gateway_index_available: >-
      {{ (skills_gateway_index.stdout | trim | default('', true)).startswith('{"skills"') }}
  no_log: true

- name: Map stored index entries by name
  # The index digest is "sha256:<hex>"; normalize to bare hex for the
  # comparison against the locally computed archive digest.
  ansible.builtin.set_fact:
    skills_gateway_stored_digests: >-
      {{ skills_gateway_stored_digests | default({})
         | combine({item.name: (item.digest | regex_replace('^sha256:', ''))}) }}
  loop: "{{ ((skills_gateway_index.stdout | trim | default('', true) or '{\"skills\":[]}') | from_json).get('skills', [])
           if skills_gateway_index_available | bool else [] }}"
  no_log: true

- name: Read the current skills list from the proxy store
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import urllib.request
        request = urllib.request.Request(
            'http://localhost:4000/v1/skills?custom_llm_provider=litellm_proxy&limit=100',
            headers={'Authorization': 'Bearer {{ litellm_master_key }}'}
        )
        print(urllib.request.urlopen(request).read().decode())
  register: skills_gateway_current
  changed_when: false
  no_log: true

- name: Map stored skills by display_title
  ansible.builtin.set_fact:
    skills_gateway_current_by_title: >-
      {{ ((skills_gateway_current.stdout | trim | default('', true) or '{}') | from_json).get('data', [])
          | selectattr('display_title', 'defined')
          | items2dict(key_name='display_title', value_name='id') }}
  no_log: true

- name: Delete drifted skills from the proxy store
  # No update endpoint exists: a changed skill is removed so the upload
  # below recreates it under a new id.
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import os, urllib.request
        request = urllib.request.Request(
            'http://localhost:4000/v1/skills/{{ skills_gateway_current_by_title[item.name] }}?custom_llm_provider=litellm_proxy',
            headers={'Authorization': 'Bearer {{ litellm_master_key }}'}, method='DELETE'
        )
        print(urllib.request.urlopen(request).read().decode())
  loop: "{{ skills_gateway_skills }}"
  when: >-
    skills_gateway_index_available | bool
    and item.name in skills_gateway_current_by_title
    and (skills_gateway_stored_digests | default({})).get(item.name, '') != skills_gateway_digests[item.name]
  register: skills_gateway_delete
  changed_when: true
  no_log: true

- name: Upload skill packages to the proxy store
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import json, mimetypes, pathlib, urllib.request
        boundary = '----ansible-skills-boundary'
        fields = {
            'display_title': '{{ item.name }}',
            'description': {{ item.description | to_json }}
        }
        body = bytearray()
        for name, value in fields.items():
            body.extend(('--' + boundary + '\r\n').encode())
            body.extend(('Content-Disposition: form-data; name="' + name + '"\r\n\r\n').encode())
            body.extend(value.encode())
            body.extend(b'\r\n')
        body.extend(('--' + boundary + '\r\n').encode())
        body.extend(('Content-Disposition: form-data; name="files[]"; filename="{{ item.name }}.zip"\r\n').encode())
        body.extend(b'Content-Type: application/zip\r\n\r\n')
        body.extend(pathlib.Path('/tmp/{{ item.name }}.zip').read_bytes())
        body.extend(b'\r\n--' + boundary.encode() + b'--\r\n')
        request = urllib.request.Request(
            'http://localhost:4000/v1/skills?custom_llm_provider=litellm_proxy',
            data=bytes(body), method='POST',
            headers={'Authorization': 'Bearer {{ litellm_master_key }}', 'Content-Type': 'multipart/form-data; boundary=' + boundary}
        )
        print(urllib.request.urlopen(request).read().decode())
  loop: "{{ skills_gateway_skills }}"
  when: >-
    item.name not in skills_gateway_current_by_title
    or (skills_gateway_index_available | bool
        and (skills_gateway_stored_digests | default({})).get(item.name, '') != skills_gateway_digests[item.name])
  register: skills_gateway_upload
  changed_when: true
  no_log: true

- name: Re-read the proxy store to resolve skill ids
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import urllib.request
        request = urllib.request.Request(
            'http://localhost:4000/v1/skills?custom_llm_provider=litellm_proxy&limit=100',
            headers={'Authorization': 'Bearer {{ litellm_master_key }}'}
        )
        print(urllib.request.urlopen(request).read().decode())
  register: skills_gateway_after_upload
  changed_when: false
  no_log: true

- name: Resolve each skill's stored skill_id
  ansible.builtin.set_fact:
    skills_gateway_skill_ids: >-
      {{ skills_gateway_skill_ids | default({})
         | combine({item.name:
                    (((skills_gateway_after_upload.stdout | trim | default('', true) or '{}') | from_json).get('data', [])
                     | selectattr('display_title', 'equalto', item.name) | map(attribute='id') | list | last)}) }}
  loop: "{{ skills_gateway_skills }}"
  no_log: true

- name: Query the registry for an existing marketplace entry
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import urllib.request, urllib.error
        request = urllib.request.Request(
            'http://localhost:4000/claude-code/plugins/{{ item.name }}',
            headers={'Authorization': 'Bearer {{ litellm_master_key }}'}
        )
        try:
            response = urllib.request.urlopen(request)
            print(response.status)
        except urllib.error.HTTPError as error:
            print(error.code)
  loop: "{{ skills_gateway_skills }}"
  register: skills_gateway_registry_state
  changed_when: false
  failed_when: false
  no_log: true

- name: Create missing skills in the Claude Code marketplace registry
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import json, urllib.request
        data = {{ {'name': item.0.name,
                   'source': {'source': 'archive',
                              'url': 'https://litellm.' ~ domain ~ '/v1/skills/' ~ skills_gateway_skill_ids[item.0.name] ~ '/archive',
                              'sha256': skills_gateway_digests[item.0.name]},
                   'description': item.0.description,
                   'domain': 'Engineering',
                   'keywords': [item.0.name],
                   'version': '1.0.0'} | to_json }}
        request = urllib.request.Request(
            'http://localhost:4000/claude-code/plugins',
            data=json.dumps(data).encode(), method='POST',
            headers={'Authorization': 'Bearer {{ litellm_master_key }}', 'Content-Type': 'application/json'}
        )
        print(urllib.request.urlopen(request).read().decode())
  loop: "{{ skills_gateway_skills | zip(skills_gateway_registry_state.results) | list }}"
  when: item.1.stdout | default('') | trim == '404'
  register: skills_gateway_register_new
  changed_when: true
  no_log: true

- name: Refresh existing marketplace entries after store changes
  # PUT is a full replace that bumps the patch version; only run it when
  # this run changed the store (upload or delete above), keeping reruns
  # with unchanged skills from churning versions.
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import json, urllib.request
        data = {{ {'source': {'source': 'archive',
                              'url': 'https://litellm.' ~ domain ~ '/v1/skills/' ~ skills_gateway_skill_ids[item.0.name] ~ '/archive',
                              'sha256': skills_gateway_digests[item.0.name]},
                     'description': item.0.description,
                     'domain': 'Engineering',
                     'keywords': [item.0.name]} | to_json }}
        request = urllib.request.Request(
            'http://localhost:4000/claude-code/plugins/{{ item.0.name }}',
            data=json.dumps(data).encode(), method='PUT',
            headers={'Authorization': 'Bearer {{ litellm_master_key }}', 'Content-Type': 'application/json'}
        )
        print(urllib.request.urlopen(request).read().decode())
  loop: "{{ skills_gateway_skills | zip(skills_gateway_registry_state.results) | list }}"
  when:
    - item.1.stdout | default('') | trim == '200'
    - (skills_gateway_upload is changed) or (skills_gateway_delete is changed)
  register: skills_gateway_register_update
  changed_when: true
  no_log: true

- name: Verify semantic skill search is configured
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import urllib.parse, urllib.request
        query = urllib.parse.urlencode({'custom_llm_provider': 'litellm_proxy', 'query': '{{ skills_gateway_skills[0].name }}', 'top_k': '3'})
        request = urllib.request.Request(
            'http://localhost:4000/v1/skills?' + query,
            headers={'Authorization': 'Bearer {{ litellm_master_key }}'}
        )
        print(urllib.request.urlopen(request).read().decode())
  register: skills_gateway_search
  when: skills_gateway_skills | length > 0
  changed_when: false
  failed_when: false
  no_log: true

- name: Show skill search result count
  ansible.builtin.debug:
    msg: >-
      Skill search returned
      {{ ((skills_gateway_search.stdout | trim | default('', true) or '{}') | from_json).get('data', []) | length }}
      skill(s) for "{{ skills_gateway_skills[0].name | default('') }}".
  when: skills_gateway_search is not skipped and (skills_gateway_search.stdout | default('') | length > 0)
