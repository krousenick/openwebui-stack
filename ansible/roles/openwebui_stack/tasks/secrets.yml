---
# Secrets are explicit values in group_vars/all/vault.yml (template) and
# vault.local.yml (real values, gitignored). This task only verifies every
# required secret is present and not left as a CHANGE_ME placeholder, so a
# half-populated vault fails fast with the exact list of missing names.

- name: Resolve the current value of each stack secret
  ansible.builtin.set_fact:
    openwebui_stack_secret_values: >-
      {{ openwebui_stack_secret_values | default({})
         | combine({item: lookup('ansible.builtin.vars', item) | default('', true)}) }}
  loop: "{{ stack_secret_names }}"
  run_once: true
  no_log: true

- name: Collect missing or placeholder secrets
  ansible.builtin.set_fact:
    openwebui_stack_bad_secrets: >-
      {{ openwebui_stack_secret_values | dict2items
         | selectattr('value', 'in', ['CHANGE_ME', '', none, 'null'])
         | map(attribute='key') | list }}
  run_once: true
  no_log: true

- name: Verify every stack secret is set
  ansible.builtin.assert:
    that:
      - openwebui_stack_bad_secrets | length == 0
    fail_msg: >-
      These secrets are missing or still set to a placeholder in
      group_vars/all/vault.local.yml: {{ openwebui_stack_bad_secrets | join(', ') }}.
      Populate them and re-run.
  run_once: true
