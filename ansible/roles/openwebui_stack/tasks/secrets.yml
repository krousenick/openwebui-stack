---
# Resolve every stack secret using the tiering documented in
# group_vars/all/vault.yml:
#   vault entry -> environment variable -> deployed .env -> generated.
#
# The tiering chain lives in the vault.yml variable definitions, and the
# first three tiers resolve lazily wherever the variable is used. This task
# only handles the final tier: for each stack secret that still resolves
# to an empty value after the first three tiers, generate a value once,
# define it as a vault_<name> fact (so the tiering resolves through it on
# this very run), and persist it into the vault file on the controller so
# every later run resolves through the vault entry and the secret stays
# stable. Secrets already present in the deployed .env are never
# regenerated, which keeps upgrades of existing deployments non-breaking.

- name: Locate the vault variables file on the controller
  ansible.builtin.set_fact:
    openwebui_stack_vault_vars_file: "{{ playbook_dir }}/../group_vars/all/vault.yml"

- name: Read the resolved value of each stack secret
  ansible.builtin.set_fact:
    openwebui_stack_secret_values: >-
      {{ openwebui_stack_secret_values | default({})
         | combine({item: lookup('vars', item) | default('', true)}) }}
  loop: "{{ stack_secret_names }}"
  run_once: true
  no_log: true

- name: Build the generated value per empty secret
  ansible.builtin.set_fact:
    openwebui_stack_generated_secrets: >-
      {{ openwebui_stack_generated_secrets | default({})
         | combine({item: lookup('ansible.builtin.password', '/dev/null', length=32, chars=stack_secret_charset)})
         if (openwebui_stack_secret_values[item] | default('')) == '' else openwebui_stack_generated_secrets | default({}) }}
  loop: "{{ stack_secret_names }}"
  run_once: true
  no_log: true

- name: Define each generated secret as a vault fact for this run
  ansible.builtin.set_fact:
    "{{ 'vault_' + item.key }}": "{{ item.value }}"
  loop: "{{ openwebui_stack_generated_secrets | default({}) | dict2items }}"
  loop_control:
    label: "vault_{{ item.key }}"
  run_once: true
  no_log: true

- name: Persist each generated secret as a vault entry
  ansible.builtin.lineinfile:
    path: "{{ openwebui_stack_vault_vars_file }}"
    regexp: '^vault_{{ item.key }}:'
    line: 'vault_{{ item.key }}: {{ item.value }}'
    insertbefore: EOF
    mode: "0600"
  loop: "{{ openwebui_stack_generated_secrets | default({}) | dict2items }}"
  loop_control:
    label: "vault_{{ item.key }}"
  delegate_to: localhost
  run_once: true
  become: false
  no_log: true
