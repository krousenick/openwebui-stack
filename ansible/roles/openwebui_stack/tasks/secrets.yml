---
# Secrets are explicit values in group_vars/all/vault.yml (template) and
# vault.local.yml (real values, gitignored). Any stack secret that is unset,
# empty, or still a template placeholder (CHANGE_ME,
# change-me-before-production) is generated here once, applied to this run,
# and persisted to vault.local.yml so later runs reuse the same value.
#
# Generated values are alphanumeric (safe in DATABASE_URL and .env), 32 chars
# (oauth2-proxy needs a 16/24/32-byte cookie secret). Keys that must carry an
# sk- prefix (LiteLLM master key, Open WebUI api key) get one.
#
# An ansible-vault encrypted vault.local.yml is never rewritten: the run fails
# listing the names to populate by hand instead.

- name: Resolve the current value of each stack secret
  ansible.builtin.set_fact:
    openwebui_stack_secret_values: >-
      {{ openwebui_stack_secret_values | default({})
         | combine({item: lookup('ansible.builtin.vars', item, default='') | default('', true)}) }}
  loop: "{{ stack_secret_names }}"
  run_once: true
  no_log: true

- name: Collect missing or placeholder secrets
  ansible.builtin.set_fact:
    openwebui_stack_bad_secrets: >-
      {{ openwebui_stack_secret_values | dict2items
         | selectattr('value', 'in', stack_secret_placeholders + ['', none, 'null'])
         | map(attribute='key') | list }}
  run_once: true
  no_log: true

- name: Generate missing or placeholder secrets
  when: openwebui_stack_bad_secrets | length > 0
  run_once: true
  block:
    - name: Report which secrets will be generated
      ansible.builtin.debug:
        msg: >-
          Generating {{ openwebui_stack_bad_secrets | length }} secret(s) and
          saving them to {{ stack_vault_local_file }}:
          {{ openwebui_stack_bad_secrets | join(', ') }}

    - name: Check whether vault.local.yml is ansible-vault encrypted
      ansible.builtin.command:
        argv: [head, -c, "14", "{{ stack_vault_local_file }}"]
      delegate_to: localhost
      become: false
      register: openwebui_stack_vault_head
      changed_when: false
      failed_when: false

    - name: Refuse to rewrite an encrypted vault.local.yml
      ansible.builtin.assert:
        that:
          - not (openwebui_stack_vault_head.stdout | default('')).startswith('$ANSIBLE_VAULT')
        fail_msg: >-
          {{ stack_vault_local_file }} is ansible-vault encrypted, so the
          playbook will not write generated secrets into it. Set these by hand
          (ansible-vault edit) and re-run:
          {{ openwebui_stack_bad_secrets | join(', ') }}

    - name: Generate a value for each missing secret
      ansible.builtin.set_fact:
        openwebui_stack_generated_secrets: >-
          {{ openwebui_stack_generated_secrets | default({})
             | combine({item: (('sk-' if item in stack_secret_sk_prefixed else '')
                               ~ lookup('ansible.builtin.password', '/dev/null',
                                        chars=['ascii_letters', 'digits'], length=32))}) }}
      loop: "{{ openwebui_stack_bad_secrets }}"
      no_log: true

    - name: Persist generated secrets to vault.local.yml
      ansible.builtin.lineinfile:
        path: "{{ stack_vault_local_file }}"
        regexp: "^{{ item.key }}:"
        line: "{{ item.key }}: {{ item.value }}"
        create: true
        mode: "0600"
      loop: "{{ openwebui_stack_generated_secrets | dict2items }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: Apply generated secrets to this run
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ openwebui_stack_generated_secrets | dict2items }}"
      no_log: true
