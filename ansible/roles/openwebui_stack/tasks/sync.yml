---
# Sync stack configuration trees from the control machine's checkout to the
# deployed tree. Only meaningful when the playbook runs from another host
# (e.g. the Mac): with ansible_connection: local on Photon, source and
# destination are the same tree, so the task is skipped instead of trying
# to rsync the host onto itself over SSH (which cannot authenticate).
# The collector image runs as uid 10001. A 0640 root-owned config cannot
# be read and the container crash-loops, which leaves Grafana empty.
# litellm/config.yaml is excluded because tasks/litellm_config.yml renders
# it from templates/config.yaml.j2: the raw checkout copy still carries
# the ${DOMAIN} placeholder in the playwright Host header, which litellm
# (no env substitution in config values) cannot expand.
- name: Sync stack configuration trees
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../{{ item }}/"
    dest: "{{ project_root }}/{{ item }}/"
    delete: false
    private_key: "{{ hostvars[inventory_hostname].ansible_ssh_private_key_file | default(omit) }}"
    verify_host: false
    rsync_path: rsync
    rsync_opts:
      - "--chmod=D755,F644"
      - "--exclude=.env"
      - "--exclude=*.key"
      - "--exclude=*.pem"
      - "--exclude=litellm/config.yaml"
  loop:
    - otel
    - grafana
    - traefik
    - json-exporter
    - litellm
    - sandbox
    - printer-mcp
    - blender
    - freecad
    - skills
  delegate_to: localhost
  # Synchronize's delegated mode builds its rsync from the delegate host's
  # connection settings (localhost: agent identities, no key), not the
  # inventory host's, so the inventory host's private key must be passed
  # explicitly or SSH fails with "Too many authentication failures" (the
  # agent offers every loaded identity first). rsync_path is pinned because
  # the play's become:true would otherwise inject "sudo -u root rsync" on
  # the remote side, and Photon has no sudo; the deploy user is already
  # root. The when must be evaluated from the delegated host's perspective
  # too; a bare `ansible_connection != 'local'` reads the delegate host's
  # connection (always local for localhost) and would skip the sync on
  # every run. hostvars[] pins both to the inventory host.
  when: hostvars[inventory_hostname].ansible_connection | default('ssh') != 'local'
