---
- name: Install host prerequisites
  ansible.builtin.import_tasks:
    file: prerequisites.yml

- name: Create project directories
  ansible.builtin.import_tasks:
    file: directories.yml

- name: Sync stack files
  ansible.builtin.import_tasks:
    file: sync.yml

- name: Deploy Docker Compose stack
  ansible.builtin.import_tasks:
    file: compose.yml

- name: Configure optional Brave Search
  ansible.builtin.import_tasks:
    file: brave.yml
  when: brave_search_enabled | bool and brave_search_api_key | length > 0

- name: Configure Keycloak SSO
  ansible.builtin.import_tasks:
    file: keycloak.yml
  tags:
    - keycloak
