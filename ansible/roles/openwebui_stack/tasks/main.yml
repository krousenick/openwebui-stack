---
# Host prerequisites (base packages, Docker, docker compose) are checked first
# by the global prerequisites role, which runs before this one in
# playbooks/site.yml.
#
# Order matters: secrets and certs must exist before the .env and compose
# file are rendered; Keycloak must be up before its realm is provisioned,
# which the keycloak task handles by waiting on the endpoint.

- name: Resolve stack secrets
  ansible.builtin.import_tasks:
    file: secrets.yml
  tags:
    - secrets
    - environment

- name: Manage host name resolution
  ansible.builtin.import_tasks:
    file: hosts.yml
  when: manage_hosts_file | bool

- name: Create project directories
  ansible.builtin.import_tasks:
    file: directories.yml

- name: Provision TLS certificates
  ansible.builtin.import_tasks:
    file: certs.yml
  tags:
    - certs

- name: Sync stack files
  ansible.builtin.import_tasks:
    file: sync.yml
  tags:
    - always

- name: Render the LiteLLM config
  ansible.builtin.import_tasks:
    file: litellm_config.yml
  tags:
    - environment

- name: Render application environment
  ansible.builtin.import_tasks:
    file: environment.yml
  tags:
    - environment

- name: Render the Docker Compose file
  ansible.builtin.import_tasks:
    file: compose_template.yml
  tags:
    - environment

- name: Verify compose bind-mount sources are present before starting
  ansible.builtin.import_tasks:
    file: compose_mount_check.yml
  tags:
    - compose

- name: Deploy Docker Compose stack
  ansible.builtin.import_tasks:
    file: compose.yml
  tags:
    - compose

- name: Assert Open WebUI connection config
  ansible.builtin.import_tasks:
    file: openwebui_config.yml
  tags:
    - openwebui-config

- name: Configure the code sandbox wiring in Open WebUI
  ansible.builtin.import_tasks:
    file: code_sandbox.yml
  when: code_sandbox_enabled | bool
  tags:
    - openwebui-config

- name: Configure optional MCP servers
  ansible.builtin.import_tasks:
    file: mcp/main.yml

- name: Publish skills into the Open WebUI workspace
  ansible.builtin.import_tasks:
    file: openwebui_skills.yml
  tags:
    - skills
    - openwebui-config

- name: Set the Open WebUI default model
  ansible.builtin.import_tasks:
    file: openwebui_default_models.yml
  when: openwebui_default_models_csv | length > 0
  tags:
    - skills
    - openwebui-config

- name: Configure Keycloak SSO
  ansible.builtin.import_tasks:
    file: keycloak.yml
  tags:
    - keycloak
