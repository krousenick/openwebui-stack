---
# Local name resolution on the deployment host, replacing the /etc/hosts
# handling in scripts/setup.sh. Only runs for non-localhost domains: for
# DOMAIN=localhost the client machine's own /etc/hosts entry is a manual
# step documented in the README (the host-side entry does not help the
# browser).

- name: Manage the service hostnames in /etc/hosts
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} openwebui-stack"
    block: |-
      127.0.0.1 traefik.{{ domain }}
      127.0.0.1 chatbot.{{ domain }}
      127.0.0.1 litellm.{{ domain }}
      127.0.0.1 auth.{{ domain }}
      127.0.0.1 grafana.{{ domain }}
      127.0.0.1 voice.{{ domain }}
      127.0.0.1 playwright-mcp.{{ domain }}
    owner: root
    group: root
    mode: "0644"
    state: "{{ 'present' if domain != 'localhost' else 'absent' }}"
  when: domain != 'localhost'

# One name per LLM Launcher portal (launcher-<node>.<domain>), in its own
# marked block so toggling launcher_enabled or changing the vllm_compute
# inventory never rewrites the block above.
- name: Manage the LLM Launcher portal hostnames in /etc/hosts
  vars:
    # A real newline from YAML. A '\n' literal inside the {{ }} below would
    # reach join() as a backslash and an "n", putting every name on one line.
    openwebui_stack_newline: "\n"
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} openwebui-stack launcher portals"
    block: >-
      {{ launcher_fqdns | map('regex_replace', '^', '127.0.0.1 ') | join(openwebui_stack_newline) }}
    owner: root
    group: root
    mode: "0644"
    state: >-
      {{ 'present'
         if (launcher_enabled | bool and launcher_nodes | length > 0)
         else 'absent' }}
  when: domain != 'localhost'
