---
# Thinking switch: a reasoning selector in the Open WebUI chat input for
# reasoning-capable models only.
#
# Open WebUI 0.13 has no dropdown slot in the chat input; it has switches
# (toggle filters) and a per-user settings panel per switch (UserValves).
# So the selector is two filter functions:
#
#   reasoning_switch (files/functions/reasoning_switch.py) - the "Thinking"
#     switch. On: reasoning_effort = the level the user picked in the
#     switch's settings (low / medium / high).
#   reasoning_off (files/functions/reasoning_off.py) - always-on companion.
#     Off: reasoning_effort = none. Open WebUI does not run a toggle filter
#     while its switch is off, so the off state needs its own filter.
#
# Neither is global. The task reads which models can reason from LiteLLM
# (model_info.supports_reasoning) and attaches the switch to exactly those
# models' Workspace entries (meta.filterIds), so it never shows on a model
# where it does nothing. The off-state companion is attached only where
# LiteLLM also reports supports_none_reasoning_effort: sending "none" to a
# model that cannot switch thinking off would fail the request, so there an
# off switch means "send no effort" and the provider default applies.
#
# Everything goes through the admin API (files/openwebui_reasoning_sync.py),
# which loads the functions into the running app, so no container recreate:
#
#   POST /api/v1/functions/create | /id/{id}/update | /id/{id}/toggle
#   POST /api/v1/models/create | /model/update
#
# Reruns converge: a model that stops being reasoning-capable loses the two
# managed filter ids, nothing else on its entry changes, and preset models
# are never touched. --check runs the read-only half and reports what would
# change. Rerun after playbooks/inference.yml registers or retires a
# reasoning model (playbooks/openwebui_reasoning.yml runs just this file).
#
# Auth reuses the skill-publisher admin API key that openwebui_skills.yml
# upserts from the vault value openwebui_api_admin_key; that task runs
# first in tasks/main.yml and shares the openwebui-config tag.

- name: Require the settings the Thinking switch sync needs
  ansible.builtin.assert:
    that:
      - openwebui_api_admin_key | default('') | length > 0
      - not (openwebui_reasoning_discover_models | bool) or litellm_master_key | default('') | length > 0
    fail_msg: >-
      The Thinking switch needs openwebui_api_admin_key in the vault, and
      litellm_master_key when openwebui_reasoning_discover_models is true.

- name: Read the reasoning-capable models from LiteLLM
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ compose_project_name }}_litellm"
      - python3
      - -c
      - |
        import json, sys, urllib.request
        key = sys.stdin.read().strip()
        request = urllib.request.Request(
            'http://localhost:4000/model/info',
            headers={'Authorization': 'Bearer ' + key},
        )
        reasoning, can_disable = set(), set()
        for entry in json.load(urllib.request.urlopen(request, timeout=60)).get('data', []):
            name, info = entry.get('model_name'), entry.get('model_info') or {}
            if not name or info.get('supports_reasoning') is not True:
                continue
            reasoning.add(name)
            if info.get('supports_none_reasoning_effort') is True:
                can_disable.add(name)
        print(json.dumps({'reasoning': sorted(reasoning), 'can_disable': sorted(can_disable)}))
    stdin: "{{ litellm_master_key }}"
  register: openwebui_reasoning_litellm
  changed_when: false
  # Read-only, so it also runs under --check to feed the dry run below.
  check_mode: false
  no_log: true
  when:
    - openwebui_reasoning_switch_enabled | bool
    - openwebui_reasoning_discover_models | bool

- name: Build the Thinking switch model lists
  ansible.builtin.set_fact:
    openwebui_reasoning_switch_models: >-
      {{ (openwebui_reasoning_discovered.reasoning + openwebui_reasoning_models_extra)
         | unique | difference(openwebui_reasoning_models_exclude) | sort }}
    openwebui_reasoning_off_models: >-
      {{ (openwebui_reasoning_discovered.can_disable + openwebui_reasoning_off_models_extra)
         | unique | difference(openwebui_reasoning_models_exclude) | sort }}
  vars:
    openwebui_reasoning_discovered: >-
      {{ (openwebui_reasoning_litellm.stdout | default('', true) | trim
          or '{"reasoning": [], "can_disable": []}') | from_json }}

- name: Sync the Thinking switch into Open WebUI
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - "{{ compose_project_name }}_open-webui"
      - python3
      - -c
      - "{{ lookup('ansible.builtin.file', 'openwebui_reasoning_sync.py') }}"
    # base64: a bare JSON string would be parsed back into a dict by the
    # templating layer and reach the container as a Python repr. It also
    # keeps the API key out of argv, which a failed task would print.
    stdin: "{{ openwebui_reasoning_payload | to_json | b64encode }}"
  vars:
    openwebui_reasoning_payload:
      api_key: "{{ openwebui_api_admin_key }}"
      dry_run: "{{ ansible_check_mode | bool }}"
      enabled: "{{ openwebui_reasoning_switch_enabled | bool }}"
      default_on: "{{ openwebui_reasoning_switch_default_on | bool }}"
      switch_id: reasoning_switch
      off_id: reasoning_off
      switch_models: "{{ openwebui_reasoning_switch_models }}"
      off_models: "{{ openwebui_reasoning_off_models }}"
      functions:
        # The off-state companion first: it has to exist before a model
        # entry references both ids.
        - id: reasoning_off
          name: Thinking Off State
          description: >-
            Sends reasoning_effort none when the Thinking switch is off,
            so an off switch really stops the model thinking
          content: "{{ lookup('ansible.builtin.file', 'functions/reasoning_off.py') }}"
        - id: reasoning_switch
          name: Thinking
          description: >-
            Turns model thinking on at the level picked in the switch's
            settings (low, medium or high)
          content: "{{ lookup('ansible.builtin.file', 'functions/reasoning_switch.py') }}"
  register: openwebui_reasoning_sync
  # The script always exits 0 and reports through its JSON summary; the
  # next task turns a failure into a readable message (this one is
  # no_log because its stdin carries the admin API key).
  failed_when: false
  changed_when: >-
    not ansible_check_mode
    and ((openwebui_reasoning_sync.stdout | default('', true) | trim or '{}')
         | from_json).get('changed', []) | length > 0
  check_mode: false
  no_log: true

- name: Report the Thinking switch sync
  ansible.builtin.assert:
    that:
      - openwebui_reasoning_sync.rc | default(1) == 0
      - openwebui_reasoning_summary.failed | default('no summary') | length == 0
    fail_msg: >-
      Thinking switch sync failed:
      {{ openwebui_reasoning_summary.failed | default('', true)
         or (openwebui_reasoning_sync.stderr | default('no output', true))[-800:] }}
    success_msg: >-
      Thinking switch on {{ openwebui_reasoning_summary.attached | default([]) | join(', ') | default('no models', true) }}
      (off state sends none on {{ openwebui_reasoning_off_models
        | intersect(openwebui_reasoning_summary.attached | default([])) | join(', ') | default('no models', true) }});
      {{ 'would change' if ansible_check_mode else 'changed' }}:
      {{ openwebui_reasoning_summary.changed | default([]) | join('; ') | default('nothing', true) }}
  vars:
    openwebui_reasoning_summary: >-
      {{ (openwebui_reasoning_sync.stdout | default('', true) | trim or '{}') | from_json }}

- name: Warn when a reasoning model is not served by Open WebUI yet
  ansible.builtin.debug:
    msg: >-
      WARNING: Open WebUI does not list
      {{ openwebui_reasoning_summary.missing | join(', ') }} as a base
      model, so the Thinking switch was not attached there. Rerun once
      the model shows in the chat picker; a Workspace preset with the
      same id is never modified.
  vars:
    openwebui_reasoning_summary: >-
      {{ (openwebui_reasoning_sync.stdout | default('', true) | trim or '{}') | from_json }}
  when: openwebui_reasoning_summary.missing | default([]) | length > 0
