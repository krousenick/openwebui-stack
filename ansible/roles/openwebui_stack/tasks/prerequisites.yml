---
- name: Install required packages on Debian-family hosts
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - openssl
      - python3
      - python3-pip
    state: present
    update_cache: true
  when: ansible_facts.os_family == "Debian"

- name: Install required packages on RedHat-family hosts
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - curl
      - openssl
      - python3
    state: present
  when: ansible_facts.os_family == "RedHat"

- name: Install required packages on Photon OS
  ansible.builtin.command:
    cmd: tdnf install -y ca-certificates curl openssl python3
  register: photon_packages
  changed_when: "'Nothing to do' not in photon_packages.stdout"
  when: ansible_facts.distribution == "VMware Photon OS"

- name: Check Docker
  ansible.builtin.command:
    cmd: docker version
  register: docker_version
  changed_when: false

- name: Check Docker Compose
  ansible.builtin.command:
    cmd: docker compose version
  register: docker_compose_version
  changed_when: false

- name: Display Docker versions
  ansible.builtin.debug:
    msg:
      - "{{ docker_version.stdout }}"
      - "{{ docker_compose_version.stdout }}"
