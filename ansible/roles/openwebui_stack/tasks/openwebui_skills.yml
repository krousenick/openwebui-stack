---
# Publish the centralized skills (./skills SKILL.md packages) into the
# Open WebUI workspace so every chat user can $mention them or bind them
# to models. Open WebUI skills live in its own database with version
# history, so this goes through the real API instead of writing rows:
#
#   POST /api/v1/skills/create  - create (400 when the id is taken)
#   POST /api/v1/skills/id/{id}/update - replace content; requires
#        expected_version_id matching the stored row's version_id
#
# Idempotency: skill id = the SKILL.md frontmatter name. When the id
# already exists, the task PUTs the content only when it differs from
# the stored version (compared through GET /api/v1/skills/id/{id}), so a
# rerun with unchanged skills touches nothing.
#
# Auth: Open WebUI API keys are random client-generated secrets stored in
# the api_key table (there is no server-side mint endpoint usable without
# an existing session). The task upserts a dedicated admin user row and
# its api_key from the vault value `openwebui_api_admin_key`, the same
# tiering as every other stack secret. ENABLE_API_KEYS is already true in
# the compose template, and the admin role bypasses the per-user
# features.api_keys permission check.

- name: Require Open WebUI skill publishing settings
  ansible.builtin.assert:
    that:
      - openwebui_db_user | length > 0
      - openwebui_db_password | length > 0
      - openwebui_db_name | length > 0
      - openwebui_api_admin_key | default('') | length > 0
    fail_msg: >-
      Open WebUI skill publishing requires the Open WebUI database
      settings and openwebui_api_admin_key in the vault.

- name: Ensure the skill-publisher admin account and API key exist
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -i
      - -e
      - PGPASSWORD={{ openwebui_db_password }}
      - "{{ compose_project_name }}_postgres"
      - psql
      - -v
      - ON_ERROR_STOP=1
      - -U
      - "{{ openwebui_db_user }}"
      - -d
      - "{{ openwebui_db_name }}"
  args:
    stdin: |
      -- Idempotent upsert: fixed user id, fixed key id.
      INSERT INTO "user" (id, email, name, role, created_at, updated_at)
      VALUES ('skill-publisher', 'skill-publisher@{{ domain }}', 'Skill Publisher', 'admin',
              (extract(epoch from now())*1000)::bigint, (extract(epoch from now())*1000)::bigint)
      ON CONFLICT (id) DO UPDATE SET role = 'admin', updated_at = (extract(epoch from now())*1000)::bigint;

      INSERT INTO api_key (id, user_id, key, created_at, updated_at)
      VALUES ('skill-publisher-key', 'skill-publisher', '{{ openwebui_api_admin_key }}',
              (extract(epoch from now())*1000)::bigint, (extract(epoch from now())*1000)::bigint)
      ON CONFLICT (id) DO UPDATE SET key = EXCLUDED.key, updated_at = (extract(epoch from now())*1000)::bigint;
  register: openwebui_skills_publisher_db
  changed_when: "'INSERT 0 1' in openwebui_skills_publisher_db.stdout"
  no_log: true

- name: Wait for the Open WebUI API
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_open-webui"
      - curl
      - -s
      - -o
      - /dev/null
      - -w
      - "%{http_code}"
      - "http://localhost:8080/health"
  register: openwebui_skills_health
  until: openwebui_skills_health.stdout | trim == '200'
  retries: 30
  delay: 5
  changed_when: false

- name: Publish each skill into the Open WebUI workspace
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ compose_project_name }}_open-webui"
      - python3
      - -c
      - >-
        import json, sys, urllib.request, pathlib
        name, desc, path, key = sys.argv[1], sys.argv[2], sys.argv[3], sys.argv[4]
        content = pathlib.Path(path).read_text()

        def call(method, url, payload=None):
            data = json.dumps(payload).encode() if payload is not None else None
            req = urllib.request.Request(url, data=data, method=method)
            req.add_header('Authorization', 'Bearer ' + key)
            req.add_header('Content-Type', 'application/json')
            try:
                with urllib.request.urlopen(req) as resp:
                    return resp.status, json.loads(resp.read() or b'null')
            except urllib.error.HTTPError as e:
                return e.code, json.loads(e.read() or b'null')

        base = 'http://localhost:8080/api/v1/skills'
        status, current = call('GET', base + '/id/' + name)
        if status == 200:
            if current.get('content') == content:
                print('unchanged')
                sys.exit(0)
            status, updated = call('POST', base + '/id/' + name + '/update', {
                'id': name, 'name': current.get('name', name),
                'description': desc, 'content': content,
                'expected_version_id': current.get('version_id'),
                'commit_message': 'Synced from openwebui-stack skills/ checkout'})
            if status != 200:
                print('update failed: ' + json.dumps(updated)); sys.exit(1)
            print('updated')
        else:
            status, created = call('POST', base + '/create', {
                'id': name, 'name': name, 'description': desc, 'content': content})
            if status != 200:
                print('create failed: ' + json.dumps(created)); sys.exit(1)
            print('created')
      - "{{ item.name }}"
      - "{{ item.description }}"
      - "/app/skills/{{ item.package }}/SKILL.md"
      - "{{ openwebui_api_admin_key }}"
  loop: "{{ skills_gateway_skills }}"
  register: openwebui_skills_publish
  changed_when: "'created' in openwebui_skills_publish.stdout_lines or 'updated' in openwebui_skills_publish.stdout_lines"
  failed_when: >-
    openwebui_skills_publish.rc != 0
    or 'failed' in openwebui_skills_publish.stdout
  no_log: true
