---
# Role mechanics only. Deployment configuration (domain, TLS mode, compose
# profiles, chatterbox_device) lives in group_vars/all/vars.yml; secrets in
# group_vars/all/vault.yml + vault.local.yml. Nothing here reads the
# environment. These defaults exist so the role fails fast when a required
# group_vars value is missing instead of silently falling back.

compose_file: "{{ project_root }}/docker-compose.yml"

env_file: "{{ project_root }}/.env"

docker_compose_wait_timeout: 180

# Traefik dashboard basic-auth user. The apr1 hash is computed at run time
# from traefik_dashboard_password (vault).
traefik_dashboard_user: admin

selfsigned_key_size: 4096
selfsigned_valid_days: 365
selfsigned_subject:
  country: US
  state: State
  city: City
  org: Open WebUI Stack
  ou: Development
selfsigned_san:
  - "DNS:{{ domain }}"
  - "DNS:*.{{ domain }}"
  - "DNS:localhost"
  - "DNS:*.localhost"
  - "IP:127.0.0.1"
  - "IP:::1"

# Every stack secret the .env render needs. The assert in tasks/secrets.yml
# fails the run listing exactly which ones are missing or left as the
# CHANGE_ME placeholder.
stack_secret_names:
  - postgres_password
  - openwebui_db_password
  - litellm_db_password
  - openwebui_secret_key
  - litellm_master_key
  - litellm_salt_key
  - grafana_admin_password
  - qdrant_api_key
  - valkey_password
  - keycloak_db_password
  - keycloak_admin_password
  - openwebui_oidc_client_secret
  - litellm_oidc_client_secret
  - grafana_oidc_client_secret
  - voice_oidc_client_secret
  - oauth2_proxy_cookie_secret
  - keycloak_provisioner_client_secret
  - traefik_dashboard_password
  - code_sandbox_token
  - openwebui_api_admin_key
  - keycloak_user_platform_admin_password
  - keycloak_user_grafana_editor_password
  - keycloak_user_grafana_viewer_password
  - keycloak_user_openwebui_user_password
  - keycloak_user_litellm_user_password
  - keycloak_user_litellm_viewer_password

docker_gid: "999"

backup_retention_days: 7

# Keycloak admin console IP allowlist (commented Traefik ipwhitelist in the
# compose file consumes it).
keycloak_admin_ip_range: "0.0.0.0/0"

# User self-registration on the platform realm login page. Off by default.
# When true the Keycloak login page shows a Register link, and every new
# account lands in keycloak_default_groups (role mappings in group_vars
# keycloak_group_role_mappings grant it access).
# Default groups are applied after the groups exist, and Keycloak's realm
# update replaces the whole list, so while registration is enabled clearing
# this list removes the realm's default groups on the next run.
# keycloak_verify_email needs an SMTP server configured in Keycloak; leave
# false until one exists or self-registered users cannot finish signup.
keycloak_registration_enabled: false
keycloak_verify_email: false
keycloak_default_groups: []

# Playwright MCP cluster. When true, the playbook adds the Open WebUI tool
# server connection for the playwright_cluster LiteLLM MCP server. The
# containers and Traefik wiring live in docker-compose.yml. Set false in
# group_vars to skip the wiring.
playwright_mcp_enabled: true

# Isolated code-sandbox (pinned jupyter/scipy-notebook image, backend-only
# network, token auth). When true, the compose file adds the code-sandbox
# container and Open WebUI's Jupyter code-execution wiring points at it.
# The legacy in-process engines stay disabled either way. Set false in
# group_vars to drop the sandbox entirely.
code_sandbox_enabled: true

# AWS Bedrock models in the LiteLLM model_list. Off by default: they need
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (see .env.example) and provision
# nothing useful without credentials. Set true in group_vars once the AWS
# keys exist.
litellm_bedrock_models_enabled: false

# Google Gemini models in the LiteLLM model_list, plus the auto/adaptive
# routers and the voice-assistant alias that route to them. Off by default:
# they need GEMINI_API_KEY (see .env.example) and provision nothing useful
# without a key. Set true in group_vars once the Gemini key exists.
litellm_gemini_models_enabled: false

# Agent Skills discovery index (litellm_settings.public_skills_index).
# Serves every proxy-hosted skill in ./skills at
# /.well-known/agent-skills/index.json for `npx skills add` (opencode,
# Claude Code, and other Agent Skills clients). Unauthenticated by design;
# set false to keep skills visible only to keys with store access.
skills_public_index_enabled: true
