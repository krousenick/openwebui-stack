---
# Role mechanics only. Deployment configuration (domain, TLS mode, compose
# profiles, chatterbox_device) lives in group_vars/all/vars.yml; secrets in
# group_vars/all/vault.yml + vault.local.yml. Nothing here reads the
# environment. These defaults exist so the role fails fast when a required
# group_vars value is missing instead of silently falling back.

compose_file: "{{ project_root }}/docker-compose.yml"

env_file: "{{ project_root }}/.env"

docker_compose_wait_timeout: 180

# Traefik dashboard basic-auth user. The apr1 hash is computed at run time
# from traefik_dashboard_password (vault).
traefik_dashboard_user: admin

selfsigned_key_size: 4096
selfsigned_valid_days: 365
selfsigned_subject:
  country: US
  state: State
  city: City
  org: Open WebUI Stack
  ou: Development
selfsigned_san:
  - "DNS:{{ domain }}"
  - "DNS:*.{{ domain }}"
  - "DNS:localhost"
  - "DNS:*.localhost"
  - "IP:127.0.0.1"
  - "IP:::1"

# Every stack secret the .env render needs. tasks/secrets.yml generates any
# that are unset, empty, or still a template placeholder, and persists them
# to stack_vault_local_file.
stack_vault_local_file: "{{ playbook_dir }}/../group_vars/all/vault.local.yml"
stack_secret_placeholders:
  - CHANGE_ME
  - change-me-before-production
# Generated with an sk- prefix (LiteLLM and Open WebUI require it).
stack_secret_sk_prefixed:
  - litellm_master_key
  - openwebui_api_admin_key
stack_secret_names:
  - litellm_generic_client_state
  - postgres_password
  - openwebui_db_password
  - litellm_db_password
  - openwebui_secret_key
  - litellm_master_key
  - litellm_salt_key
  - grafana_admin_password
  - qdrant_api_key
  - valkey_password
  - keycloak_db_password
  - keycloak_admin_password
  - openwebui_oidc_client_secret
  - litellm_oidc_client_secret
  - grafana_oidc_client_secret
  - voice_oidc_client_secret
  - oauth2_proxy_cookie_secret
  - launcher_oidc_client_secret
  - keycloak_provisioner_client_secret
  - traefik_dashboard_password
  - code_sandbox_token
  - openwebui_api_admin_key
  - keycloak_user_platform_admin_password
  - keycloak_user_grafana_editor_password
  - keycloak_user_grafana_viewer_password
  - keycloak_user_openwebui_user_password
  - keycloak_user_litellm_user_password
  - keycloak_user_litellm_viewer_password

docker_gid: "999"

backup_retention_days: 7

# Keycloak admin console IP allowlist (commented Traefik ipwhitelist in the
# compose file consumes it).
keycloak_admin_ip_range: "0.0.0.0/0"

# User self-registration on the platform realm login page. Off by default.
# When true the Keycloak login page shows a Register link, and every new
# account lands in keycloak_default_groups (role mappings in group_vars
# keycloak_group_role_mappings grant it access).
# Default groups are applied after the groups exist, and Keycloak's realm
# update replaces the whole list, so while registration is enabled clearing
# this list removes the realm's default groups on the next run.
# keycloak_verify_email needs an SMTP server configured in Keycloak; leave
# false until one exists or self-registered users cannot finish signup.
keycloak_registration_enabled: false
keycloak_verify_email: false
keycloak_default_groups: []

# LLM Launcher portals. The launcher GUI and its oauth2-proxy gate run on
# the vLLM compute nodes (role vllm_compute, vllm_launcher_enabled); this
# role provides the stack-host half: the `launcher` Keycloak client, one
# Traefik route per portal (https://<prefix><node>.<domain> -> the node's
# gate), and the /etc/hosts entries. When false the routes and hosts
# entries are removed; the Keycloak client stays (like voice).
launcher_enabled: false

# Nodes that get a portal: every vllm_compute host of THIS inventory by
# default. A node without a running gate (a ray worker, or the launcher
# disabled on the nodes) only yields a route Traefik reports as unhealthy,
# so the default needs no knowledge of the compute topology. The names must
# be the inventory hostnames playbooks/inference.yml deploys under, because
# each gate answers as <prefix><its inventory hostname>.<domain>. When the
# compute nodes are deployed from a different inventory (tests/vllm-remote)
# or this one carries placeholder addresses, list the names here and give
# their addresses in launcher_node_addresses.
launcher_nodes: "{{ groups['vllm_compute'] | default([]) | list }}"

# Address Traefik reaches each node's gate on, keyed by the name in
# launcher_nodes. A node not listed here uses its inventory ansible_host.
#   launcher_node_addresses:
#     vllm-node-01: 192.0.2.20
launcher_node_addresses: {}

# Must match vllm_launcher_hostname_prefix / vllm_launcher_auth_port in the
# vllm_compute role: the node's gate answers under this name on this port.
launcher_hostname_prefix: "launcher-"
launcher_auth_port: 4180

# Derived, not configured. Portal names follow the same rule as the
# vllm_compute role: prefix + inventory hostname, lowercased, anything
# outside [a-z0-9-] replaced with "-". launcher.<domain> stands in when no
# compute host exists, so the Keycloak client always has a redirect URI.
# The group references are '\1' with ONE backslash: these are {{ }}
# templates in block scalars, where Ansible hands the backslash to the
# filter as written ('\\1' would insert a literal "\1").
launcher_node_labels: >-
  {{ launcher_nodes | map('lower') | map('regex_replace', '[^a-z0-9-]', '-') | list }}
launcher_fqdns: >-
  {{ (launcher_node_labels
      | map('regex_replace', '^(.*)$', launcher_hostname_prefix ~ '\1.' ~ domain) | list)
     or ['launcher.' ~ domain] }}
launcher_redirect_uris: >-
  {{ launcher_fqdns | map('regex_replace', '^(.*)$', 'https://\1/oauth2/callback') | list }}
launcher_post_logout_redirect_uris: >-
  {{ launcher_fqdns | map('regex_replace', '^(.*)$', 'https://\1') | list }}

# Playwright MCP cluster. When true, the playbook adds the Open WebUI tool
# server connection for the playwright_cluster LiteLLM MCP server. The
# containers and Traefik wiring live in docker-compose.yml. Set false in
# group_vars to skip the wiring.
playwright_mcp_enabled: true

# Isolated code-sandbox (pinned jupyter/scipy-notebook image, backend-only
# network, token auth). When true, the compose file adds the code-sandbox
# container and Open WebUI's Jupyter code-execution wiring points at it.
# The legacy in-process engines stay disabled either way. Set false in
# group_vars to drop the sandbox entirely.
code_sandbox_enabled: true

# AWS Bedrock models in the LiteLLM model_list. Off by default: they need
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (see .env.example) and provision
# nothing useful without credentials. Set true in group_vars once the AWS
# keys exist.
litellm_bedrock_models_enabled: false

# Google Gemini models in the LiteLLM model_list, plus the auto/adaptive
# routers and the voice-assistant alias that route to them. Off by default:
# they need GEMINI_API_KEY (see .env.example) and provision nothing useful
# without a key. Set true in group_vars once the Gemini key exists.
litellm_gemini_models_enabled: false

# Anthropic Claude models in the LiteLLM model_list (claude-opus-5-5,
# claude-sonnet-5-5, claude-haiku-5-5, claude-fable-5-2). Off by default:
# they need ANTHROPIC_API_KEY (vault: anthropic_api_key) and provision
# nothing useful without a key. Set true in group_vars once the key exists.
litellm_anthropic_models_enabled: false

# LiteLLM `auto` model (auto_router/complexity_router): which model_name
# answers each complexity tier. A tier value is one model_name or a list
# (random pick per request). All four tiers are required; {} drops the
# `auto` model. Derived from the provider flags: the Gemini models when
# litellm_gemini_models_enabled is true, else the Claude models when
# litellm_anthropic_models_enabled is true, otherwise nothing, because the
# role cannot rank Bedrock, vLLM, or llama.cpp models by strength. Override
# in group_vars to route over whatever the deployment serves, e.g.
#   litellm_auto_router_tiers:
#     SIMPLE: qwen3-next
#     MEDIUM: [qwen3-next, my-vllm-model]
#     COMPLEX: qwen3-coder
#     REASONING: kimi-k3
litellm_auto_router_gemini_tiers:
  SIMPLE: gemini-3.5-flash-lite
  MEDIUM: gemini-3.8-flash
  COMPLEX: gemini-4-argon
  REASONING: gemini-3.1-pro
litellm_auto_router_anthropic_tiers:
  SIMPLE: claude-haiku-5-5
  MEDIUM: claude-sonnet-5-5
  COMPLEX: claude-opus-5-5
  REASONING: claude-opus-5-5
litellm_auto_router_tiers: >-
  {{ litellm_auto_router_gemini_tiers
     if litellm_gemini_models_enabled | default(false) | bool
     else (litellm_auto_router_anthropic_tiers
           if litellm_anthropic_models_enabled | default(false) | bool else {}) }}

# Model the auto router uses when a turn cannot be classified. Defaults to
# the MEDIUM tier (its first entry when the tier is a list).
litellm_auto_router_default_model: >-
  {{ [litellm_auto_router_tiers.MEDIUM | default('')] | flatten | first | default('')
     if litellm_auto_router_tiers | length > 0 else '' }}

# LiteLLM `adaptive` model (auto_router/adaptive_router, beta): the pool of
# model_names its bandit picks from. [] drops the `adaptive` model. Derived
# from the provider flags the same way as the auto tiers: the Gemini models
# when litellm_gemini_models_enabled is true, else the Claude models when
# litellm_anthropic_models_enabled is true, otherwise nothing. Override in
# group_vars to pool whatever the deployment serves. Every pool model needs
# a quality tier, strengths, and an input price: set them with
# litellm_adaptive_router_preferences below (vLLM models get theirs from
# the vllm_compute role: vllm_adaptive_quality_tier, vllm_adaptive_strengths).
# claude-fable-5-2 is left out of the Claude pool: it is the most expensive
# model and returns a 400 for organizations under zero data retention.
litellm_adaptive_router_gemini_models:
  - gemini-3.5-flash-lite
  - gemini-3.8-flash
  - gemini-3.1-pro
  - gemini-4-argon
litellm_adaptive_router_anthropic_models:
  - claude-haiku-5-5
  - claude-sonnet-5-5
  - claude-opus-5-5
litellm_adaptive_router_models: >-
  {{ litellm_adaptive_router_gemini_models
     if litellm_gemini_models_enabled | default(false) | bool
     else (litellm_adaptive_router_anthropic_models
           if litellm_anthropic_models_enabled | default(false) | bool else []) }}

# Adaptive router settings per model, keyed by LiteLLM model_name and
# rendered into that model's model_info in templates/config.yaml.j2:
#   quality_tier: 1 (budget), 2 (mid), 3 (frontier) - cold-start prior
#   strengths: request types the model is strong at (code_generation,
#     code_understanding, technical_design, analytical_reasoning, writing,
#     factual_lookup, general)
#   input_cost_per_token: $/token, the router's cost signal (0 = free)
# Applies to the models that template declares: Gemini, Claude, Bedrock.
# Set litellm_adaptive_router_preferences in group_vars to change or add
# entries; it merges over the defaults key by key, so one field of one
# model can be changed without restating the rest, e.g.
#   litellm_adaptive_router_preferences:
#     claude-opus-5-5:
#       quality_tier: 2
#     kimi-k3:
#       quality_tier: 3
#       strengths: [analytical_reasoning]
#       input_cost_per_token: 0.0000006
# quality_tier: null drops a model's tier and strengths. A model with no
# entry renders none of these keys.
# Default prices: Gemini from LiteLLM model_prices 2026-10-28; Claude from
# Anthropic list prices 2026-11-03 (Haiku: prompts up to 100K tokens).
litellm_adaptive_router_default_preferences:
  gemini-3.5-flash-lite:
    quality_tier: 1
    strengths: [factual_lookup]
    input_cost_per_token: 0.0000003
  gemini-3.8-flash:
    quality_tier: 2
    strengths: [writing, code_understanding]
    input_cost_per_token: 0.00000075
  gemini-3.1-pro:
    quality_tier: 3
    strengths: [analytical_reasoning]
    input_cost_per_token: 0.000002
  gemini-4-argon:
    quality_tier: 3
    strengths: [code_generation, technical_design, analytical_reasoning]
    input_cost_per_token: 0.000002
  claude-haiku-5-5:
    quality_tier: 1
    strengths: [factual_lookup]
    input_cost_per_token: 0.0000001
  claude-sonnet-5-5:
    quality_tier: 2
    strengths: [writing, code_understanding]
    input_cost_per_token: 0.000002
  claude-opus-5-5:
    quality_tier: 3
    strengths: [code_generation, technical_design, analytical_reasoning]
    input_cost_per_token: 0.000004
litellm_adaptive_router_preferences: {}

# Derived, not configured: the defaults with the group_vars entries merged
# over them. This is what the template and the validation read.
litellm_adaptive_router_model_info: >-
  {{ litellm_adaptive_router_default_preferences
     | combine(litellm_adaptive_router_preferences | default({}, true), recursive=true) }}

# Open WebUI default model for new chats (admin Settings > Models >
# Default Models). LiteLLM model_names as a list or a comma-separated
# string; more than one opens new chats in multi-model mode. Defaults to
# `auto` whenever the auto router above is rendered, otherwise empty, which
# leaves whatever is set in the UI alone. Seeds DEFAULT_MODELS on first
# boot and is enforced through the admin API on every run
# (tasks/openwebui_default_models.yml), because the env var is a persisted
# ConfigVar that Open WebUI ignores after first boot. A user's own
# Settings > Interface default still wins for that user.
openwebui_default_models: "{{ 'auto' if litellm_auto_router_tiers | length > 0 else '' }}"

# Derived, not configured: the list or string above as the comma-separated
# value Open WebUI stores.
openwebui_default_models_csv: >-
  {{ [openwebui_default_models | default('', true)] | flatten | join(',')
     | split(',') | map('trim') | reject('equalto', '') | join(',') }}

# Thinking switch: the reasoning selector in the Open WebUI chat input
# (tasks/openwebui_reasoning.yml). A "Thinking" switch appears in the
# chat input of every reasoning-capable model; on sends the level each
# user picks in the switch's settings (low / medium / high), off sends
# reasoning_effort none. false removes it from every model and disables
# both filter functions.
openwebui_reasoning_switch_enabled: true

# New chats start with the switch on, matching a LiteLLM default effort
# that already has the model thinking. false starts them off.
openwebui_reasoning_switch_default_on: true

# Read the model list from LiteLLM: the switch goes on every model whose
# model_info has supports_reasoning: true, and the off state (none) only
# where it also has supports_none_reasoning_effort: true. For a vLLM model
# both come from vllm_reasoning_parser / vllm_reasoning_efforts.
openwebui_reasoning_discover_models: true

# Hand-picked additions and removals, as LiteLLM model_names. _extra adds
# the switch, _off_models_extra also marks a model as accepting "none"
# (only list models that really can switch thinking off), _exclude wins
# over both and over discovery.
openwebui_reasoning_models_extra: []
openwebui_reasoning_off_models_extra: []
openwebui_reasoning_models_exclude: []

# Agent Skills discovery index (litellm_settings.public_skills_index).
# Serves every proxy-hosted skill in ./skills at
# /.well-known/agent-skills/index.json for `npx skills add` (opencode,
# Claude Code, and other Agent Skills clients). Unauthenticated by design;
# set false to keep skills visible only to keys with store access.
skills_public_index_enabled: true

# Chat from the LiteLLM admin UI (its Playground and Chat pages). Off:
# people talk to models through Open WebUI or an API client (opencode, an
# IDE), and the admin UI stays for keys, models, usage and settings. Two
# pieces, both off this one switch:
#   - general_settings.enable_chat_ui in litellm/config.yaml removes the
#     Chat page. LiteLLM has no switch for the Playground, so its menu
#     entry stays.
#   - litellm/ui_chat_block_callback.py (a startup hook) refuses model
#     calls made with an admin UI session or from the proxy's own /ui
#     pages, with a message that names Open WebUI. MCP tool tests, search
#     tool tests and model health checks from the UI keep working.
litellm_ui_chat_enabled: false

# Where the compose template mounts ./container-scripts (read-only) in the
# litellm and open-webui containers. tasks/container_script.yml runs the
# scripts from this path with the container's own Python.
container_scripts_mount: /opt/stack-scripts

# Derived, not configured: the JSON report of the latest
# tasks/container_script.yml run, parsed. Empty when that run was skipped
# or failed. Read it right after the import; the next run replaces it.
container_script_report: "{{ container_script_run.stdout | default('{}', true) | from_json }}"
