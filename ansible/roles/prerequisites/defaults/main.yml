---
# Run the optional NVIDIA driver check on this host. Set true in
# group_vars for GPU node groups (vllm_compute). Check-only: the host is
# expected to have the driver installed already.
prerequisites_check_nvidia: false

# Container CLI the playbook drives on this host: 'docker' (default) or
# 'podman'. Controls the availability check below and, when missing and
# prerequisites_install_missing is true, which packages get installed.
prerequisites_container_cli: docker

# When true, the role installs the container CLI and the NVIDIA container
# toolkit (CDI) itself instead of failing. Keep false for hosts whose
# install is managed by hand (the historical behavior: fail fast with
# guidance). Set true in group_vars for nodes Ansible should fully prepare.
prerequisites_install_missing: false

# CDI spec path nvidia-ctk generates for podman nodes. Matches the
# nvidia-cdi-refresh service default.
prerequisites_nvidia_cdi_spec: /var/run/cdi/nvidia.yaml

# NVIDIA container toolkit repository for Fedora/RHEL-family hosts, used
# when prerequisites_install_missing installs the toolkit (it is not in the
# stock Fedora repos).
prerequisites_nvidia_toolkit_repo_url: https://nvidia.github.io/libnvidia-container/stable/rpm/nvidia-container-toolkit.repo
