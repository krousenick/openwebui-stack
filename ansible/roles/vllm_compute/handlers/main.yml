---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart vllm-ray
  ansible.builtin.systemd:
    name: "{{ vllm_ray_service_name }}"
    state: restarted
    daemon_reload: true

- name: Restart vllm-serve
  ansible.builtin.systemd:
    name: "{{ vllm_vllm_service_name }}"
    state: restarted
    daemon_reload: true
