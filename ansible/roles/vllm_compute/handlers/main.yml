---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Restart vllm-ray
  ansible.builtin.systemd:
    name: "{{ vllm_ray_service_name }}"
    state: restarted
    daemon_reload: true

- name: Restart vllm-serve
  # Not on a node whose primary model slot the launcher owns: there the
  # unit stays stopped, and a changed script must not start it.
  ansible.builtin.systemd:
    name: "{{ vllm_vllm_service_name }}"
    state: restarted
    daemon_reload: true
  when: not (vllm_launcher_primary_owned | default(false) | bool)

- name: Restart flux services
  ansible.builtin.systemd:
    name: "vllm-flux-{{ flux_item.name }}"
    state: restarted
    daemon_reload: true
  loop: "{{ vllm_flux_effective_models | default([]) }}"
  loop_control:
    loop_var: flux_item

- name: Restart aux services
  ansible.builtin.systemd:
    name: "vllm-aux-{{ aux_item.name }}"
    state: restarted
    daemon_reload: true
  loop: "{{ vllm_aux_local_models | default([]) }}"
  loop_control:
    loop_var: aux_item

- name: Restart monitoring exporters
  ansible.builtin.systemd:
    name: "{{ item.name }}.service"
    state: restarted
    daemon_reload: true
  loop: "{{ vllm_monitoring_deploy | default([]) }}"
  when: vllm_container_cli == 'podman'

- name: Restart vllm log shipper
  ansible.builtin.systemd:
    name: vllm-log-shipper
    state: restarted
    daemon_reload: true
  when:
    - vllm_monitoring_enabled | bool
    - vllm_log_shipping_enabled | bool
