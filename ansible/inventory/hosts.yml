---
# Connection facts only. All deployment configuration lives in
# group_vars/all/vars.yml; all secrets live in group_vars/all/vault.yml.
all:
  children:
    openwebui:
      hosts:
        photon:
          ansible_host: STACK_HOST_IP
          ansible_user: root
          ansible_ssh_private_key_file: /home/nicholas_krouse/.ssh/id_rsa_STACK_HOST_IP
          ansible_ssh_common_args: "-o IdentitiesOnly=yes"

    # WSL2 Fedora hosts for provisioning. These are Windows machines
    # that will run WSL2 with Fedora, Docker, and NVIDIA GPU passthrough.
    # Run `ansible-playbook playbooks/wsl2.yml` to provision them first,
    # then add the resulting WSL2 IP to vllm_compute.
    wsl2_hosts:
      hosts:
        # Example Windows host (uncomment and configure):
        # windows-desktop:
        #   ansible_host: 192.168.1.100
        #   ansible_user: admin
        #   ansible_password: <password>
        #   ansible_connection: winrm
        #   ansible_winrm_transport: ntlm

    # vLLM distributed inference compute nodes connected over 10/25GbE.
    # Set the real hostnames/IPs, keep exactly one vllm_ray_head: true,
    # and set ansible_user to an account with sudo on each node.
    # WSL2 Fedora nodes can be added here after provisioning.
    vllm_compute:
      hosts:
        vllm-node-01:
          ansible_host: COMPUTE_NODE_01_IP
          ansible_user: root
          vllm_ray_head: true
        vllm-node-02:
          ansible_host: COMPUTE_NODE_02_IP
          ansible_user: root
        vllm-node-03:
          ansible_host: COMPUTE_NODE_03_IP
          ansible_user: root
        # Example WSL2 Fedora node (add after running wsl2.yml):
        # wsl2-fedora:
        #   ansible_host: <WSL2-IP-FROM-PROVISIONING>
        #   ansible_user: root
