---
all:
  children:
    openwebui:
      hosts:
        photon:
          ansible_connection: local
          ansible_host: 10.0.105.14
          ansible_user: root
          keycloak_url: "https://auth.{{ lookup('ansible.builtin.env', 'DOMAIN') | default('localhost', true) }}"
          keycloak_validate_certs: "{{ (lookup('ansible.builtin.env', 'KEYCLOAK_VALIDATE_CERTS') | default('true', true)) | bool }}"

    # vLLM distributed inference compute nodes connected over 10/25GbE.
    # Set the real hostnames/IPs, keep exactly one vllm_ray_head: true,
    # and set ansible_user to an account with sudo on each node.
    vllm_compute:
      hosts:
        vllm-node-01:
          ansible_host: 10.0.105.21
          ansible_user: root
          vllm_ray_head: true
        vllm-node-02:
          ansible_host: 10.0.105.22
          ansible_user: root
        vllm-node-03:
          ansible_host: 10.0.105.23
          ansible_user: root
