---
# =============================================================================
# Vault template (tracked). Real values live in vault.local.yml next to this
# file, which is gitignored. Copy this file to vault.local.yml, replace the
# CHANGE_ME placeholders, and run the playbook; nothing reads environment
# variables. Keep vault.local.yml out of git; for team use, encrypt it with
# ansible-vault instead.
# =============================================================================

# Stack secrets (rendered into .env by the playbook)
postgres_password: CHANGE_ME
openwebui_db_password: CHANGE_ME
litellm_db_password: CHANGE_ME
openwebui_secret_key: CHANGE_ME
litellm_master_key: CHANGE_ME
litellm_salt_key: CHANGE_ME
grafana_admin_password: CHANGE_ME
qdrant_api_key: CHANGE_ME
valkey_password: CHANGE_ME
keycloak_db_password: CHANGE_ME
keycloak_admin_password: CHANGE_ME
openwebui_oidc_client_secret: CHANGE_ME
litellm_oidc_client_secret: CHANGE_ME
grafana_oidc_client_secret: CHANGE_ME
voice_oidc_client_secret: CHANGE_ME
oauth2_proxy_cookie_secret: CHANGE_ME
keycloak_provisioner_client_secret: CHANGE_ME
traefik_dashboard_password: CHANGE_ME
code_sandbox_token: CHANGE_ME

# Keycloak application user passwords
keycloak_user_platform_admin_password: CHANGE_ME
keycloak_user_grafana_editor_password: CHANGE_ME
keycloak_user_grafana_viewer_password: CHANGE_ME
keycloak_user_openwebui_user_password: CHANGE_ME
keycloak_user_litellm_user_password: CHANGE_ME
keycloak_user_litellm_viewer_password: CHANGE_ME

# LiteLLM generic SSO state parameter (must match GENERIC_CLIENT_STATE in .env)
litellm_generic_client_state: change-me-before-production

# Optional API keys (leave empty to disable the integration)
brave_search_api_key: ""
gemini_api_key: ""
aws_access_key_id: ""
aws_secret_access_key: ""
aws_region: ""
hf_token: ""
grafana_discord_webhook_url: ""
