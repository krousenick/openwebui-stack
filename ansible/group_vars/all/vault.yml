---
# Secret resolution tiering, per secret:
#   1. vault_<name>           - explicitly set in this file (keep the file
#                               encrypted with ansible-vault in production).
#   2. <ENVIRONMENT> variable - exported by CI or the operator's shell.
#   3. deployed .env value    - keeps an already-deployed secret stable
#                               across re-runs and upgrades.
#   4. generated once         - a random 32-char value generated on the
#                               first run when nothing is found; it is then
#                               written back into vault.yml below by the
#                               openwebui_stack secrets task, so it never
#                               changes again.
#
# Encrypt this file for real deployments:
#   ansible-vault encrypt group_vars/all/vault.yml
litellm_generic_client_state: "{{ lookup('ansible.builtin.env', 'GENERIC_CLIENT_STATE') | default('change-me-before-production', true) }}"

keycloak_user_platform_admin_password: "{{ vault_keycloak_user_platform_admin_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_USER_PLATFORM_ADMIN_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_USER_PLATFORM_ADMIN_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_user_grafana_editor_password: "{{ vault_keycloak_user_grafana_editor_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_USER_GRAFANA_EDITOR_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_USER_GRAFANA_EDITOR_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_user_grafana_viewer_password: "{{ vault_keycloak_user_grafana_viewer_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_USER_GRAFANA_VIEWER_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_USER_GRAFANA_VIEWER_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_user_openwebui_user_password: "{{ vault_keycloak_user_openwebui_user_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_USER_OPENWEBUI_USER_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_USER_OPENWEBUI_USER_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_user_litellm_user_password: "{{ vault_keycloak_user_litellm_user_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_USER_LITELLM_USER_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_USER_LITELLM_USER_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_user_litellm_viewer_password: "{{ vault_keycloak_user_litellm_viewer_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_USER_LITELLM_VIEWER_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_USER_LITELLM_VIEWER_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"

# ---------------------------------------------------------------------------
# Stack secrets (formerly generated by scripts/setup.sh).
# Each resolves in order: vault_<name>, then <ENVIRONMENT>, then the value
# already in the deployed .env, then a random value generated on first run
# and persisted back into this file by the secrets task.
# ---------------------------------------------------------------------------

postgres_password: "{{ vault_postgres_password | default(lookup('ansible.builtin.env', 'POSTGRES_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'POSTGRES_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
openwebui_db_password: "{{ vault_openwebui_db_password | default(lookup('ansible.builtin.env', 'OPENWEBUI_DB_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'OPENWEBUI_DB_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
litellm_db_password: "{{ vault_litellm_db_password | default(lookup('ansible.builtin.env', 'LITELLM_DB_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'LITELLM_DB_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
openwebui_secret_key: "{{ vault_openwebui_secret_key | default(lookup('ansible.builtin.env', 'OPENWEBUI_SECRET_KEY', default=None) or lookup('ansible.builtin.ini', 'OPENWEBUI_SECRET_KEY', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
litellm_master_key: "{{ vault_litellm_master_key | default(lookup('ansible.builtin.env', 'LITELLM_MASTER_KEY', default=None) or lookup('ansible.builtin.ini', 'LITELLM_MASTER_KEY', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
litellm_salt_key: "{{ vault_litellm_salt_key | default(lookup('ansible.builtin.env', 'LITELLM_SALT_KEY', default=None) or lookup('ansible.builtin.ini', 'LITELLM_SALT_KEY', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
grafana_admin_password: "{{ vault_grafana_admin_password | default(lookup('ansible.builtin.env', 'GF_SECURITY_ADMIN_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'GF_SECURITY_ADMIN_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
qdrant_api_key: "{{ vault_qdrant_api_key | default(lookup('ansible.builtin.env', 'QDRANT_API_KEY', default=None) or lookup('ansible.builtin.ini', 'QDRANT_API_KEY', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
valkey_password: "{{ vault_valkey_password | default(lookup('ansible.builtin.env', 'VALKEY_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'VALKEY_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_db_password: "{{ vault_keycloak_db_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_DB_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_DB_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_admin_password: "{{ vault_keycloak_admin_password | default(lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_ADMIN_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
openwebui_oidc_client_secret: "{{ vault_openwebui_oidc_client_secret | default(lookup('ansible.builtin.env', 'OPENWEBUI_OIDC_CLIENT_SECRET', default=None) or lookup('ansible.builtin.ini', 'OPENWEBUI_OIDC_CLIENT_SECRET', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
litellm_oidc_client_secret: "{{ vault_litellm_oidc_client_secret | default(lookup('ansible.builtin.env', 'LITELLM_OIDC_CLIENT_SECRET', default=None) or lookup('ansible.builtin.ini', 'LITELLM_OIDC_CLIENT_SECRET', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
grafana_oidc_client_secret: "{{ vault_grafana_oidc_client_secret | default(lookup('ansible.builtin.env', 'GF_OIDC_CLIENT_SECRET', default=None) or lookup('ansible.builtin.ini', 'GF_OIDC_CLIENT_SECRET', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
voice_oidc_client_secret: "{{ vault_voice_oidc_client_secret | default(lookup('ansible.builtin.env', 'VOICE_OIDC_CLIENT_SECRET', default=None) or lookup('ansible.builtin.ini', 'VOICE_OIDC_CLIENT_SECRET', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
oauth2_proxy_cookie_secret: "{{ vault_oauth2_proxy_cookie_secret | default(lookup('ansible.builtin.env', 'OAUTH2_PROXY_COOKIE_SECRET', default=None) or lookup('ansible.builtin.ini', 'OAUTH2_PROXY_COOKIE_SECRET', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
keycloak_provisioner_client_secret: "{{ vault_keycloak_provisioner_client_secret | default(lookup('ansible.builtin.env', 'KEYCLOAK_PROVISIONER_CLIENT_SECRET', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_PROVISIONER_CLIENT_SECRET', file=deployed_env_file, type='properties', errors='ignore'), true) }}"

# Traefik dashboard basic-auth password. The apr1 hash rendered into .env is
# derived from it (tasks/traefik_auth.yml).
traefik_dashboard_password: "{{ vault_traefik_dashboard_password | default(lookup('ansible.builtin.env', 'TRAEFIK_DASHBOARD_PASSWORD', default=None) or lookup('ansible.builtin.ini', 'TRAEFIK_DASHBOARD_PASSWORD', file=deployed_env_file, type='properties', errors='ignore'), true) }}"
