---
# ---------------------------------------------------------------------------
# Deployment configuration. Every value is explicit; nothing reads from the
# environment or from the deployed .env. Secrets live in vault.yml.
# ---------------------------------------------------------------------------

project_root: /mnt/data1/openwebui-stack
compose_project_name: openwebui-stack

domain: krouse.io

timezone: UTC

# ---------------------------------------------------------------------------
# PostgreSQL databases (shared postgres instance; per-service roles and
# databases provisioned by init-db/01-init-databases.sh)
# ---------------------------------------------------------------------------

postgres_db: postgres
postgres_user: postgres

openwebui_db_name: openwebui
openwebui_db_user: openwebui

litellm_db_name: litellm
litellm_db_user: litellm

keycloak_db_name: keycloak
keycloak_db_user: keycloak

# ---------------------------------------------------------------------------
# Keycloak
# ---------------------------------------------------------------------------

keycloak_realm: platform
keycloak_url: "https://auth.{{ domain }}"

# TLS verification for the controller-side Keycloak API calls. The
# deployment serves a Cloudflare Origin certificate on auth.<domain>; the
# Origin CA is not in the host trust store, so verification is off here.
# Set true when auth.<domain> serves a publicly trusted certificate.
keycloak_validate_certs: false

keycloak_provisioner_client_id: keycloak-provisioner
keycloak_realm_management_client_id: master-realm
keycloak_admin_user: admin

# Keycloak 26 enables passkeys on the default browser flow. Users register
# a passwordless credential, then sign in from the username form.
keycloak_passkeys_enabled: true

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------

ssl_cert_type: existing

# Basenames under certs/ of the deployed pair. The Photon deployment uses
# a Cloudflare Origin certificate; a fresh lab install sets these to
# wildcard.crt / wildcard.key or switches ssl_cert_type to selfsigned.
ssl_cert_file: "cf-origin.crt"
ssl_key_file: "cf-origin.key"

# ---------------------------------------------------------------------------
# Docker
# ---------------------------------------------------------------------------

docker_compose_profiles:
  - monitoring

# gpu -> Dockerfile (CUDA). cpu -> Dockerfile.cpu. Selects the chatterbox profile.
chatterbox_device: gpu

# Include the chatterbox services in the rendered compose file at all.
chatterbox_enabled: true

# Write /etc/hosts entries on the deployment host for non-localhost
# domains. Set false when name resolution is handled by DNS.
manage_hosts_file: true

# oauth2-proxy performs OIDC discovery against https://auth.<domain> and
# verifies TLS like any Go client. With a Cloudflare Origin certificate
# the Origin CA is not in the container trust store, so discovery fails
# with x509 until this is true. Set false when auth.<domain> serves a
# publicly trusted certificate.
oauth2_proxy_ssl_insecure_skip_verify: true

docker_compose_pull: true

# ---------------------------------------------------------------------------
# Optional integrations
# ---------------------------------------------------------------------------

# Brave Search MCP. Set the API key in vault.yml. When enabled and the key
# is present, the playbook wires the gateway search path, Open WebUI
# search, and the Brave MCP connection.
brave_search_enabled: true

# Playwright MCP cluster. When true, the playbook adds the Open WebUI tool
# server connection for the playwright_cluster LiteLLM MCP server. The
# containers and Traefik wiring live in docker-compose.yml.
playwright_mcp_enabled: false

# opencode (terminal AI coding agent). Host users who get an opencode
# install pointed at the LiteLLM proxy. Empty list disables the role.
opencode_users: []

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------

keycloak_apps:

  - client_id: grafana
    client_secret: "{{ grafana_oidc_client_secret }}"
    name: Grafana
    base_url: "https://grafana.{{ domain }}"
    redirect_uris:
      - "https://grafana.{{ domain }}/login/generic_oauth"
    roles:
      - grafanaadmin
      - admin
      - editor
      - viewer

  - client_id: open-webui
    client_secret: "{{ openwebui_oidc_client_secret }}"
    name: Open WebUI
    base_url: "https://chatbot.{{ domain }}"
    redirect_uris:
      - "https://chatbot.{{ domain }}/oauth/oidc/callback"
    roles:
      - openwebui_admin
      - openwebui_user
    include_groups: true

  - client_id: voice
    client_secret: "{{ voice_oidc_client_secret }}"
    name: Voice
    base_url: "https://voice.{{ domain }}"
    redirect_uris:
      - "https://voice.{{ domain }}/oauth2/callback"
    roles:
      - voice_user

  - client_id: litellm
    client_secret: "{{ litellm_oidc_client_secret }}"
    name: LiteLLM
    base_url: "https://litellm.{{ domain }}"
    redirect_uris:
      - "https://litellm.{{ domain }}/sso/callback"
    # LiteLLM generic SSO does not send a PKCE verifier unless
    # GENERIC_CLIENT_USE_PKCE is true. Keycloak rejects the code exchange
    # when this client requires S256 and LiteLLM does not.
    pkce: false
    roles:
      - proxy_admin
      - proxy_admin_viewer
      - internal_user
      - internal_user_viewer
    include_groups: true

# ---------------------------------------------------------------------------
# Keycloak groups
# Role names are the values docker-compose.yml reads from the roles claim.
# ---------------------------------------------------------------------------

# realm-management roles for the platform realm. Members administer the realm
# from the Keycloak admin console (https://auth.{{ domain }}/admin/{{ keycloak_realm }}/console/).
keycloak_platform_realm_admin_group: platform-admins
keycloak_platform_realm_admin_roles:
  - name: manage-realm
  - name: view-realm
  - name: manage-users
  - name: view-users
  - name: query-users
  - name: manage-clients
  - name: view-clients
  - name: query-clients
  - name: query-groups

keycloak_group_role_mappings:
  - group: platform-admins
    client_id: grafana
    role: grafanaadmin
  - group: platform-admins
    client_id: open-webui
    role: openwebui_admin
  - group: platform-admins
    client_id: voice
    role: voice_user
  - group: platform-admins
    client_id: litellm
    role: proxy_admin
  - group: admin
    client_id: grafana
    role: admin
  - group: admin
    client_id: open-webui
    role: openwebui_admin
  - group: admin
    client_id: litellm
    role: proxy_admin
  - group: editor
    client_id: grafana
    role: editor
  - group: viewer
    client_id: grafana
    role: viewer
  - group: user
    client_id: open-webui
    role: openwebui_user
  - group: user
    client_id: litellm
    role: internal_user
  - group: litellm-admin
    client_id: litellm
    role: proxy_admin
  - group: litellm-viewer
    client_id: litellm
    role: proxy_admin_viewer

# ---------------------------------------------------------------------------
# Keycloak users
# Passwords come from group_vars/all/vault.yml.
# group_memberships is a list of {name: <group>} for keycloak_user.
# ---------------------------------------------------------------------------

keycloak_users:
  - username: platform-admin
    email: "platform-admin@{{ domain }}"
    first_name: Platform
    last_name: Admin
    password: "{{ keycloak_user_platform_admin_password }}"
    group_memberships:
      - name: platform-admins
  - username: grafana-editor
    email: "grafana-editor@{{ domain }}"
    first_name: Grafana
    last_name: Editor
    password: "{{ keycloak_user_grafana_editor_password }}"
    group_memberships:
      - name: editor
  - username: grafana-viewer
    email: "grafana-viewer@{{ domain }}"
    first_name: Grafana
    last_name: Viewer
    password: "{{ keycloak_user_grafana_viewer_password }}"
    group_memberships:
      - name: viewer
  - username: openwebui-user
    email: "openwebui-user@{{ domain }}"
    first_name: OpenWebUI
    last_name: User
    password: "{{ keycloak_user_openwebui_user_password }}"
    group_memberships:
      - name: user
  - username: litellm-user
    email: "litellm-user@{{ domain }}"
    first_name: LiteLLM
    last_name: User
    password: "{{ keycloak_user_litellm_user_password }}"
    group_memberships:
      - name: user
  - username: litellm-viewer
    email: "litellm-viewer@{{ domain }}"
    first_name: LiteLLM
    last_name: Viewer
    password: "{{ keycloak_user_litellm_viewer_password }}"
    group_memberships:
      - name: litellm-viewer
