---
# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------

project_root: /mnt/data1/openwebui-stack
compose_project_name: openwebui-stack

domain: "{{ lookup('ansible.builtin.env', 'DOMAIN') | default('localhost', true) }}"

timezone: UTC

# ---------------------------------------------------------------------------
# Keycloak
# ---------------------------------------------------------------------------

keycloak_realm: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_REALM') | default('platform', true) }}"
keycloak_url: "https://auth.{{ domain }}"

keycloak_validate_certs: "{{ (lookup('ansible.builtin.env', 'KEYCLOAK_VALIDATE_CERTS') | default('true', true)) | bool }}"

# The provisioning credentials should come from Ansible Vault.
keycloak_provisioner_client_id: keycloak-provisioner
keycloak_realm_management_client_id: master-realm
keycloak_admin_user: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_USER') | default('admin', true) }}"
keycloak_admin_password: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_PASSWORD') }}"
keycloak_provisioner_client_secret: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_PROVISIONER_CLIENT_SECRET') }}"

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------

ssl_cert_type: existing

ssl_cert_file: "wildcard.crt"
ssl_key_file: "wildcard.key"

# ---------------------------------------------------------------------------
# Docker
# ---------------------------------------------------------------------------

docker_compose_profiles:
  - monitoring

# gpu selects the CUDA Chatterbox image. cpu selects the CPU-only image.
chatterbox_device: gpu

# Optional. Supply BRAVE_SEARCH_API_KEY through the environment or vault.
brave_search_enabled: false
brave_search_api_key: "{{ lookup('ansible.builtin.env', 'BRAVE_SEARCH_API_KEY') }}"

docker_compose_pull: true

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------

keycloak_apps:

  - client_id: grafana
    client_secret: "{{ grafana_oidc_client_secret }}"
    name: Grafana
    base_url: "https://grafana.{{ domain }}"
    redirect_uris:
      - "https://grafana.{{ domain }}/login/generic_oauth"
    roles:
      - grafanaadmin
      - admin
      - editor
      - viewer

  - client_id: open-webui
    client_secret: "{{ openwebui_oidc_client_secret }}"
    name: Open WebUI
    base_url: "https://chatbot.{{ domain }}"
    redirect_uris:
      - "https://chatbot.{{ domain }}/oauth/oidc/callback"
    roles:
      - openwebui_admin
      - openwebui_user
    include_groups: true

  - client_id: litellm
    client_secret: "{{ litellm_oidc_client_secret }}"
    name: LiteLLM
    base_url: "https://litellm.{{ domain }}"
    redirect_uris:
      - "https://litellm.{{ domain }}/sso/callback"
    roles:
      - proxy_admin
      - proxy_admin_viewer
      - internal_user
      - internal_user_viewer
    include_groups: true

# ---------------------------------------------------------------------------
# Keycloak groups
# Role names are the values docker-compose.yml reads from the roles claim.
# ---------------------------------------------------------------------------

keycloak_group_role_mappings:
  - group: platform-admins
    client_id: grafana
    role: grafanaadmin
  - group: platform-admins
    client_id: open-webui
    role: openwebui_admin
  - group: platform-admins
    client_id: litellm
    role: proxy_admin
  - group: admin
    client_id: grafana
    role: admin
  - group: admin
    client_id: open-webui
    role: openwebui_admin
  - group: admin
    client_id: litellm
    role: proxy_admin
  - group: editor
    client_id: grafana
    role: editor
  - group: viewer
    client_id: grafana
    role: viewer
  - group: user
    client_id: open-webui
    role: openwebui_user
  - group: user
    client_id: litellm
    role: internal_user
  - group: litellm-admin
    client_id: litellm
    role: proxy_admin
  - group: litellm-viewer
    client_id: litellm
    role: proxy_admin_viewer

# ---------------------------------------------------------------------------
# Keycloak users
# Passwords come from Ansible Vault (group_vars/all/vault.yml).
# group_memberships is a list of {name: <group>} for keycloak_user.
# ---------------------------------------------------------------------------

keycloak_users:
  - username: platform-admin
    email: "platform-admin@{{ domain }}"
    first_name: Platform
    last_name: Admin
    password: "{{ keycloak_user_platform_admin_password }}"
    group_memberships:
      - name: platform-admins
  - username: grafana-editor
    email: "grafana-editor@{{ domain }}"
    first_name: Grafana
    last_name: Editor
    password: "{{ keycloak_user_grafana_editor_password }}"
    group_memberships:
      - name: editor
  - username: grafana-viewer
    email: "grafana-viewer@{{ domain }}"
    first_name: Grafana
    last_name: Viewer
    password: "{{ keycloak_user_grafana_viewer_password }}"
    group_memberships:
      - name: viewer
  - username: openwebui-user
    email: "openwebui-user@{{ domain }}"
    first_name: OpenWebUI
    last_name: User
    password: "{{ keycloak_user_openwebui_user_password }}"
    group_memberships:
      - name: user
  - username: litellm-user
    email: "litellm-user@{{ domain }}"
    first_name: LiteLLM
    last_name: User
    password: "{{ keycloak_user_litellm_user_password }}"
    group_memberships:
      - name: user
  - username: litellm-viewer
    email: "litellm-viewer@{{ domain }}"
    first_name: LiteLLM
    last_name: Viewer
    password: "{{ keycloak_user_litellm_viewer_password }}"
    group_memberships:
      - name: litellm-viewer
