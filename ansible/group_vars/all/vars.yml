---
# ---------------------------------------------------------------------------
# Deployment
# ---------------------------------------------------------------------------

project_root: /mnt/data1/openwebui-stack
compose_project_name: openwebui-stack

# Domain tiering: DOMAIN environment variable first (fresh installs), then
# the value in the deployed .env (upgrades keep the deployed domain), then
# localhost. With ansible_connection: local the controller is the
# deployment host, so the lookup reads the same .env the stack uses.
domain: "{{ lookup('ansible.builtin.env', 'DOMAIN', default=None) or lookup('ansible.builtin.ini', 'DOMAIN', file=deployed_env_file, type='properties', errors='ignore') | default('localhost', true) }}"

timezone: UTC

# ---------------------------------------------------------------------------
# Keycloak
# ---------------------------------------------------------------------------

keycloak_realm: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_REALM', default=None) or lookup('ansible.builtin.ini', 'KEYCLOAK_REALM', file=deployed_env_file, type='properties', errors='ignore') | default('platform', true) }}"
keycloak_url: "https://auth.{{ domain }}"

# TLS verification for the controller-side Keycloak API calls. The
# deployment serves a Cloudflare Origin certificate on auth.<domain>; the
# Origin CA is not in the host trust store, so verification is off here.
# Set true when auth.<domain> serves a publicly trusted certificate.
keycloak_validate_certs: "{{ (lookup('ansible.builtin.env', 'KEYCLOAK_VALIDATE_CERTS', default=None) or 'false') | bool }}"

# The provisioning credentials resolve through the secret tiering in
# group_vars/all/vault.yml (vault entry -> environment -> deployed .env ->
# generated once). The *_password / *_secret variables themselves are
# defined there; only the non-secret IDs live in this file.
keycloak_provisioner_client_id: keycloak-provisioner
keycloak_realm_management_client_id: master-realm
keycloak_admin_user: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_ADMIN_USER') | default('admin', true) }}"

# Keycloak 26 enables passkeys on the default browser flow. Users register
# a passwordless credential, then sign in from the username form.
keycloak_passkeys_enabled: true

# ---------------------------------------------------------------------------
# TLS
# ---------------------------------------------------------------------------

ssl_cert_type: existing

# Basenames under certs/ of the deployed pair. The Photon deployment uses
# a Cloudflare Origin certificate; a fresh lab install sets these to
# wildcard.crt / wildcard.key or switches ssl_cert_type to selfsigned.
ssl_cert_file: "cf-origin.crt"
ssl_key_file: "cf-origin.key"

# ---------------------------------------------------------------------------
# Docker
# ---------------------------------------------------------------------------

docker_compose_profiles:
  - monitoring

# gpu -> Dockerfile (CUDA). cpu -> Dockerfile.cpu. Selects the chatterbox profile.
chatterbox_device: gpu

# Optional. Supply BRAVE_SEARCH_API_KEY through the environment or vault.
# Normalized (trimmed, quote characters stripped) so raw CI exports or vault
# entries cannot reach .env or the Open WebUI config DB with stray quotes.
brave_search_enabled: false
brave_search_api_key: >-
  {{ lookup('ansible.builtin.env', 'BRAVE_SEARCH_API_KEY')
     | trim | replace('"', '') | replace("'", '') }}

# Optional. Enables the Open WebUI tool server connection to the Playwright
# MCP cluster (docker-compose.yml service playwright-mcp). No secret needed;
# the cluster authenticates to LiteLLM with the LiteLLM master key.
playwright_mcp_enabled: false

docker_compose_pull: true

# ---------------------------------------------------------------------------
# opencode (terminal AI coding agent)
# ---------------------------------------------------------------------------

# Host users who get an opencode install pointed at the LiteLLM proxy.
# Per-user LiteLLM virtual keys are minted with metadata.user=<username>,
# so LiteLLM SpendLogs and the LiteLLM UI attribute token usage per user.
# Empty list disables the role (nothing is installed or configured).
opencode_users: []

# ---------------------------------------------------------------------------
# Applications
# ---------------------------------------------------------------------------

keycloak_apps:

  - client_id: grafana
    client_secret: "{{ grafana_oidc_client_secret }}"
    name: Grafana
    base_url: "https://grafana.{{ domain }}"
    redirect_uris:
      - "https://grafana.{{ domain }}/login/generic_oauth"
    roles:
      - grafanaadmin
      - admin
      - editor
      - viewer

  - client_id: open-webui
    client_secret: "{{ openwebui_oidc_client_secret }}"
    name: Open WebUI
    base_url: "https://chatbot.{{ domain }}"
    redirect_uris:
      - "https://chatbot.{{ domain }}/oauth/oidc/callback"
    roles:
      - openwebui_admin
      - openwebui_user
    include_groups: true

  - client_id: voice
    client_secret: "{{ voice_oidc_client_secret }}"
    name: Voice
    base_url: "https://voice.{{ domain }}"
    redirect_uris:
      - "https://voice.{{ domain }}/oauth2/callback"
    roles:
      - voice_user

  - client_id: litellm
    client_secret: "{{ litellm_oidc_client_secret }}"
    name: LiteLLM
    base_url: "https://litellm.{{ domain }}"
    redirect_uris:
      - "https://litellm.{{ domain }}/sso/callback"
    # LiteLLM generic SSO does not send a PKCE verifier unless
    # GENERIC_CLIENT_USE_PKCE is true. Keycloak rejects the code exchange
    # when this client requires S256 and LiteLLM does not.
    pkce: false
    roles:
      - proxy_admin
      - proxy_admin_viewer
      - internal_user
      - internal_user_viewer
    include_groups: true

# ---------------------------------------------------------------------------
# Keycloak groups
# Role names are the values docker-compose.yml reads from the roles claim.
# ---------------------------------------------------------------------------

# realm-management roles for the platform realm. Members administer the realm
# from the Keycloak admin console (https://auth.{{ domain }}/admin/{{ keycloak_realm }}/console/).
keycloak_platform_realm_admin_group: platform-admins
keycloak_platform_realm_admin_roles:
  - name: manage-realm
  - name: view-realm
  - name: manage-users
  - name: view-users
  - name: query-users
  - name: manage-clients
  - name: view-clients
  - name: query-clients
  - name: query-groups

keycloak_group_role_mappings:
  - group: platform-admins
    client_id: grafana
    role: grafanaadmin
  - group: platform-admins
    client_id: open-webui
    role: openwebui_admin
  - group: platform-admins
    client_id: voice
    role: voice_user
  - group: platform-admins
    client_id: litellm
    role: proxy_admin
  - group: admin
    client_id: grafana
    role: admin
  - group: admin
    client_id: open-webui
    role: openwebui_admin
  - group: admin
    client_id: litellm
    role: proxy_admin
  - group: editor
    client_id: grafana
    role: editor
  - group: viewer
    client_id: grafana
    role: viewer
  - group: user
    client_id: open-webui
    role: openwebui_user
  - group: user
    client_id: litellm
    role: internal_user
  - group: litellm-admin
    client_id: litellm
    role: proxy_admin
  - group: litellm-viewer
    client_id: litellm
    role: proxy_admin_viewer

# ---------------------------------------------------------------------------
# Keycloak users
# Passwords come from Ansible Vault (group_vars/all/vault.yml).
# group_memberships is a list of {name: <group>} for keycloak_user.
# ---------------------------------------------------------------------------

keycloak_users:
  - username: platform-admin
    email: "platform-admin@{{ domain }}"
    first_name: Platform
    last_name: Admin
    password: "{{ keycloak_user_platform_admin_password }}"
    group_memberships:
      - name: platform-admins
  - username: grafana-editor
    email: "grafana-editor@{{ domain }}"
    first_name: Grafana
    last_name: Editor
    password: "{{ keycloak_user_grafana_editor_password }}"
    group_memberships:
      - name: editor
  - username: grafana-viewer
    email: "grafana-viewer@{{ domain }}"
    first_name: Grafana
    last_name: Viewer
    password: "{{ keycloak_user_grafana_viewer_password }}"
    group_memberships:
      - name: viewer
  - username: openwebui-user
    email: "openwebui-user@{{ domain }}"
    first_name: OpenWebUI
    last_name: User
    password: "{{ keycloak_user_openwebui_user_password }}"
    group_memberships:
      - name: user
  - username: litellm-user
    email: "litellm-user@{{ domain }}"
    first_name: LiteLLM
    last_name: User
    password: "{{ keycloak_user_litellm_user_password }}"
    group_memberships:
      - name: user
  - username: litellm-viewer
    email: "litellm-viewer@{{ domain }}"
    first_name: LiteLLM
    last_name: Viewer
    password: "{{ keycloak_user_litellm_viewer_password }}"
    group_memberships:
      - name: litellm-viewer
