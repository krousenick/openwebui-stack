---
# One-time preparation of the vllm-test OrbStack VM (run from the "fedora"
# OrbStack VM, which is the ansible controller for the rig).
#
# Installs the host prerequisites the role expects on a Fedora compute node
# (docker, firewalld), the GPU stubs (fake nvidia-smi / nvidia-ctk, a
# pre-registered nvidia docker runtime), and builds a CPU-only stand-in for
# the vllm/vllm-openai image that delegates `vllm start` to the real ray CLI
# and stubs `vllm serve` with an HTTP /health endpoint.
- name: Prepare vLLM test rig VM
  hosts: vllm_compute
  become: true
  gather_facts: true
  tasks:
    - name: Install rig host packages
      ansible.builtin.dnf:
        name:
          - docker
          - firewalld
          - openssh-server
        state: present

    - name: Enable services
      ansible.builtin.systemd:
        name: "{{ item }}"
        state: started
        enabled: true
      loop:
        - docker
        - firewalld
        - sshd

    - name: Install the nvidia-smi stub
      ansible.builtin.copy:
        dest: /usr/local/bin/nvidia-smi
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Test rig stub: report 2 fake GPUs.
          case "${1:-}" in
            --list-gpus)
              echo "GPU 0: NVIDIA GeForce RTX 409D (UUID: GPU-fake-0000)"
              echo "GPU 1: NVIDIA GeForce RTX 409D (UUID: GPU-fake-0001)"
              exit 0
              ;;
            "")
              echo "NVIDIA-SMI 550.54.16  Driver Version: 550.54.16  CUDA Version: 12.4"
              exit 0
              ;;
            *) exit 0 ;;
          esac

    - name: Install the nvidia-ctk stub
      ansible.builtin.copy:
        dest: /usr/local/bin/nvidia-ctk
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          # Test rig stub: pretend to configure the nvidia runtime.
          if [ "$1" = "runtime" ] && [ "$2" = "configure" ]; then
            echo "nvidia-ctk stub: runtime configured"
          fi
          exit 0

    - name: Pre-register the nvidia docker runtime
      ansible.builtin.copy:
        dest: /etc/docker/daemon.json
        mode: "0644"
        content: |
          {
            "runtimes": {
              "nvidia": { "path": "/usr/bin/runc", "runtimeArgs": [] }
            }
          }
      notify: Restart docker

    - name: Build the CPU vLLM stand-in image
      ansible.builtin.copy:
        dest: /opt/vllm-stub-build/vllm-stub.py
        mode: "0644"
        content: |
          #!/usr/bin/env python3
          # Test rig stub for the vLLM container.
          # `vllm start` -> real `ray start` (cluster formation is real).
          # `vllm serve` -> HTTP server exposing /health and /v1/models.
          import argparse
          import subprocess
          import sys
          from http.server import BaseHTTPRequestHandler, HTTPServer


          def ray_start(argv):
              print("[vllm-stub] delegating to real ray start: " + " ".join(argv), flush=True)
              return subprocess.call(["ray", "start"] + argv)


          def vllm_serve(argv):
              ap = argparse.ArgumentParser(add_help=False)
              ap.add_argument("model")
              ap.add_argument("--host", default="0.0.0.0")
              ap.add_argument("--port", type=int, default=8000)
              ap.add_argument("--served-model-name", dest="smn", default=None)
              args, _ = ap.parse_known_args(argv)
              smn = args.smn or args.model.rsplit("/", 1)[-1]
              print("[vllm-stub] serving %s on %s:%s" % (smn, args.host, args.port), flush=True)

              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      if self.path == "/health":
                          self._json(b'{"status":"ok"}')
                      elif self.path == "/v1/models":
                          self._json(('{"object":"list","data":[{"id":"%s","object":"model"}]}' % smn).encode())
                      else:
                          self.send_response(404)
                          self.end_headers()

                  def _json(self, body):
                      self.send_response(200)
                      self.send_header("Content-Type", "application/json")
                      self.send_header("Content-Length", str(len(body)))
                      self.end_headers()
                      self.wfile.write(body)

                  def log_message(self, *a):
                      pass

              HTTPServer((args.host, args.port), H).serve_forever()
              return 0


          def main():
              if len(sys.argv) < 2:
                  sys.exit(2)
              cmd, rest = sys.argv[1], sys.argv[2:]
              if cmd == "start":
                  sys.exit(ray_start(rest))
              if cmd == "serve":
                  sys.exit(vllm_serve(rest))
              print("[vllm-stub] unknown command %s" % cmd, file=sys.stderr)
              sys.exit(2)


          if __name__ == "__main__":
              main()

    - name: Write the stub image Dockerfile
      ansible.builtin.copy:
        dest: /opt/vllm-stub-build/Dockerfile
        mode: "0644"
        content: |
          FROM rayproject/ray:latest
          USER root
          COPY vllm-stub.py /opt/vllm-stub.py
          RUN echo '#!/bin/bash' > /usr/local/bin/vllm \
              && echo 'exec python3 /opt/vllm-stub.py "$@"' >> /usr/local/bin/vllm \
              && chmod +x /usr/local/bin/vllm
          ENTRYPOINT ["/bin/bash"]

    - name: Build the stub image
      ansible.builtin.command:
        argv:
          - docker
          - build
          - -t
          - vllm/vllm-openai:test-stub
          - /opt/vllm-stub-build
      changed_when: true

  handlers:
    - name: Restart docker
      ansible.builtin.systemd:
        name: docker
        state: restarted
