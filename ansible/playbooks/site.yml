---
- name: Deploy Open WebUI AI platform
  hosts: openwebui
  become: true
  # group_vars/all is loaded explicitly: with the playbook under playbooks/
  # Ansible does not auto-load ../group_vars. vault.yml is the tracked
  # template; vault.local.yml holds the real values and is gitignored. It is
  # optional: secrets left unset or as placeholders are generated on the first
  # run and written to it (the inner list falls back to the template when the
  # file does not exist yet).
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml
    # Do not remove: without this entry the real secrets are never loaded,
    # every one of them still reads as a placeholder, and tasks/secrets.yml
    # generates new values over the ones in vault.local.yml.
    - - ../group_vars/all/vault.local.yml
      - ../group_vars/all/vault.yml

  roles:
    # Global host checks (Docker, compose, base packages) run on every host
    # before any role touches docker compose.
    - role: ../roles/prerequisites
    - role: ../roles/openwebui_stack
    - role: ../roles/chatterbox
      tags:
        - chatterbox
    - role: ../roles/opencode
      tags:
        - opencode
