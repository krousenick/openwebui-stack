---
- name: Deploy Open WebUI AI platform
  hosts: openwebui
  become: true
  # group_vars/all is loaded explicitly: with the playbook under playbooks/
  # Ansible does not auto-load ../group_vars. vault.yml is the tracked
  # template; vault.local.yml holds the real values and is gitignored.
  vars_files:
    - ../group_vars/all/vars.yml
    - ../group_vars/all/vault.yml
    - ../group_vars/all/vault.local.yml
  roles:
    # Global host checks (Docker, compose, base packages) run on every host
    # before any role touches docker compose.
    - role: ../roles/prerequisites
    - role: ../roles/openwebui_stack
    - role: ../roles/chatterbox
      tags:
        - chatterbox
    - role: ../roles/opencode
      tags:
        - opencode
