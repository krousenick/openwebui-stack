[defaults]
inventory = inventory/hosts.yml
roles_path = roles
collections_path = ~/.ansible/collections:/usr/share/ansible/collections
interpreter_python = auto_silent
# Secrets are decrypted with a vault password file or --ask-vault-pass.
# Point vault_password_file at a private file outside the repo, e.g.:
# vault_password_file = ~/.openwebui-stack-vault-pass
forks = 5
retry_files_enabled = False
