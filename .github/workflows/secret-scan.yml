name: Secret Scan

# Strict secret detection; details in README "Secret Scanning" and in
# scripts/check-secrets.sh. Every push and pull request, on any branch and
# with no path filter, scans the whole history of the commit under test with
# gitleaks (default rules plus the stack's own in .gitleaks.toml) and
# trufflehog (verified or not, any result fails), then fails on a tracked
# secret file or an inline allow comment. The weekly and manual runs scan
# every branch and tag. Logs name the rule, commit, file and line, never the
# value.
on:
    push:
    pull_request:
    schedule:
        # 05:23 UTC Monday.
        - cron: "23 5 * * 1"
    workflow_dispatch:

permissions:
    contents: read

jobs:
    secret-scan:
        name: Scan the history for secrets
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            # The weekly and manual runs cover every branch and tag.
            SECRET_SCAN_ALL_REFS: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

        steps:
            # Pinned by commit; Dependabot (github-actions) moves the pin.
            - name: Checkout code
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
              with:
                  # Every commit of every branch and tag, not just the tip.
                  fetch-depth: 0
                  # The scanners need no token; keep it out of .git/config.
                  persist-credentials: false

            # Run through bash: a script added from Windows has no executable bit.
            - name: Install gitleaks and trufflehog (pinned, sha256-checked)
              id: install
              run: bash scripts/check-secrets.sh install

            - name: gitleaks
              run: bash scripts/check-secrets.sh gitleaks

            - name: trufflehog
              if: ${{ !cancelled() && steps.install.outcome == 'success' }}
              run: bash scripts/check-secrets.sh trufflehog

            - name: No tracked secret files or inline allow comments
              if: ${{ !cancelled() }}
              run: bash scripts/check-secrets.sh policy
