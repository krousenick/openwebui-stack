# =============================================================================
# Grafana Datasources Provisioning
# =============================================================================
# Pre-configured datasources for the LGTM stack (Loki, Grafana, Tempo, Mimir)
# All services are bundled in the grafana/otel-lgtm image and accessible via localhost

apiVersion: 1

# Remove provisioned datasources that are no longer listed below.
prune: true

datasources:
  # ===========================================================================
  # Prometheus - Metrics
  # ===========================================================================
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://lgtm:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      timeInterval: "15s"

  # ===========================================================================
  # Loki - Logs
  # ===========================================================================
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://lgtm:3100
    editable: false
    jsonData:
      maxLines: 1000
      derivedFields:
        - datasourceUid: tempo
          matcherRegex: '"traceId":"([a-f0-9]+)"'
          name: TraceID
          url: "$${__value.raw}"

  # ===========================================================================
  # Tempo - Traces
  # ===========================================================================
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://lgtm:3200
    editable: false
    jsonData:
      httpMethod: GET
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: "-1h"
        spanEndTimeShift: "1h"
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      lokiSearch:
        datasourceUid: loki

  # ===========================================================================
  # Pyroscope - Continuous Profiling
  # The otel-lgtm image runs Pyroscope on :4040 and ships the
  # grafana-pyroscope-datasource plugin; without this entry the profiles
  # signal is invisible in Grafana.
  # ===========================================================================
  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: http://lgtm:4040
    editable: false
