apiVersion: 1

policies:
  - orgId: 1
    receiver: Discord Webhook
    group_by:
      - grafana_folder
      - alertname
    routes:
      - receiver: Discord Webhook
        object_matchers:
          - - severity
            - "="
            - critical
        continue: true
      - receiver: Discord Webhook
        object_matchers:
          - - severity
            - "="
            - warning
