apiVersion: 1

groups:
  - orgId: 1
    name: GPUTemperature
    folder: Alerts
    interval: 30s
    rules:
      - uid: gpu-temperature-slowdown
        title: GPU Temperature At Slowdown Threshold
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: DCGM_FI_DEV_GPU_TEMP >= 91
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "GPU reached NVIDIA slowdown temperature"
          description: "Tesla P4 temperature is {{ $values.B }} C. NVIDIA reports 91 C as the slowdown threshold."

      - uid: gpu-temperature-shutdown
        title: GPU Temperature Near Shutdown Threshold
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: DCGM_FI_DEV_GPU_TEMP >= 94
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "GPU reached NVIDIA shutdown temperature"
          description: "Tesla P4 temperature is {{ $values.B }} C. NVIDIA reports 94 C as the shutdown threshold."

  - orgId: 1
    name: KeycloakSLOs
    folder: Alerts
    interval: 30s
    rules:
      - uid: keycloak-high-login-latency
        title: Keycloak High Login Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95,
                  sum(rate(http_server_requests_seconds_bucket{
                    uri=~"/realms/.*/(protocol|login-actions)/.*"
                  }[5m])) by (le)
                ) > 0.5
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Keycloak P95 login latency exceeds 500ms"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 500ms)"

      - uid: keycloak-critical-login-latency
        title: Keycloak Critical Login Latency
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                histogram_quantile(0.95,
                  sum(rate(http_server_requests_seconds_bucket{
                    uri=~"/realms/.*/(protocol|login-actions)/.*"
                  }[5m])) by (le)
                ) > 1
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Keycloak P95 login latency exceeds 1s"
          description: "P95 latency is {{ $value | humanizeDuration }} (threshold: 1s)"

      - uid: keycloak-high-error-rate
        title: Keycloak High Error Rate
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(http_server_requests_seconds_count{
                  uri=~"/realms/.*/(protocol|login-actions)/.*",
                  outcome="SERVER_ERROR"
                }[5m]))
                /
                sum(rate(http_server_requests_seconds_count{
                  uri=~"/realms/.*/(protocol|login-actions)/.*"
                }[5m])) > 0.001
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Keycloak server error rate exceeds 0.1%"
          description: "Error rate is {{ $value | humanizePercentage }} (threshold: 0.1%)"

      - uid: keycloak-db-pool-exhausted
        title: Keycloak DB Pool Exhausted
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 120
              to: 0
            datasourceUid: prometheus
            model:
              expr: agroal_awaiting_count > 0
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Threads waiting for database connections"
          description: "{{ $value }} threads are waiting for database connections"

      - uid: keycloak-high-login-failure-ratio
        title: Keycloak High Login Failure Ratio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: |
                sum(rate(keycloak_user_events_total{event="LOGIN_ERROR"}[5m]))
                /
                (sum(rate(keycloak_user_events_total{event="LOGIN"}[5m]))
                 + sum(rate(keycloak_user_events_total{event="LOGIN_ERROR"}[5m]))) > 0.2
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
              refId: C
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High login failure ratio detected"
          description: "Login failure ratio is {{ $value | humanizePercentage }}"
