# =============================================================================
# LiteLLM Proxy Configuration
# =============================================================================
# Documentation: https://docs.litellm.ai/docs/proxy/configs

# General settings
general_settings:
  # Enable detailed logging
  store_model_in_db: true
  store_prompts_in_spend_logs: true

  # OTEL settings for observability
  otel: true

  # Request/Response logging
  json_logs: false

  # Background health checks
  background_health_checks: false # Disables periodic background pings

  # User header mappings - maps headers from Open WebUI to LiteLLM roles
  user_header_mappings:
    - header_name: X-OpenWebUI-User-Id
      litellm_user_role: internal_user
    - header_name: X-OpenWebUI-User-Email
      litellm_user_role: customer

# Litellm settings
litellm_settings:
  # Enable streaming
  set_verbose: false

  # Cache settings
  cache: true
  cache_params:
    type: "redis"

  # OpenTelemetry callbacks for traces, logs, metrics
  callbacks: ["otel"]

  # Request timeout
  request_timeout: 6000

  # Number of retries
  num_retries: 3

  # Drop unsupported parameters for providers
  drop_params: true

  # Fallback models configuration
  fallbacks: []

# Router settings
router_settings:
  routing_strategy: simple-shuffle # Prevents latency-based routing checks
  enable_pre_call_checks: false # Disables checking model health before every call

# =============================================================================
# Model Providers Configuration
# =============================================================================
# Models are configured via environment variables set by setup script
# Environment variables used:
#   - GEMINI_API_KEY: Google Gemini API key
#   - AWS_BEDROCK_API_KEY: AWS Bedrock API key (for OSS models)
#   - AWS_REGION: AWS region (default: us-east-1)

model_list:
  # Google Gemini Models
  - model_name: gemini-2.0-flash
    litellm_params:
      model: gemini/gemini-2.0-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google Gemini 2.0 Flash - Fast and efficient"

  - model_name: gemini-2.0-flash-lite
    litellm_params:
      model: gemini/gemini-2.0-flash-lite
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google Gemini 2.0 Flash Lite - Lightweight model"

  - model_name: gemini-1.5-pro
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google Gemini 1.5 Pro - Advanced reasoning"

  - model_name: gemini-1.5-flash
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: os.environ/GEMINI_API_KEY
    model_info:
      description: "Google Gemini 1.5 Flash - Balanced performance"

  # AWS Bedrock OSS Models
  # MiniMax M2.5
  - model_name: minimax-m2.5
    litellm_params:
      model: bedrock/minimax/MiniMax-M2.5
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: us-east-1
    model_info:
      description: "MiniMax M2.5 via AWS Bedrock"

  # Qwen Models
  - model_name: qwen-2.5
    litellm_params:
      model: bedrock/qwen/qwen2.5-72b-instruct
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: us-east-1
    model_info:
      description: "Qwen 2.5 72B Instruct via AWS Bedrock"

  - model_name: qwen-2.5-coder
    litellm_params:
      model: bedrock/qwen/qwen2.5-coder-32b-instruct
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: us-east-1
    model_info:
      description: "Qwen 2.5 Coder 32B Instruct via AWS Bedrock"

  # Kimi Models (if available in region)
  - model_name: kimi-moonshot
    litellm_params:
      model: bedrock/moonshot/moonshot-v1-8k
      aws_access_key_id: os.environ/AWS_ACCESS_KEY_ID
      aws_secret_access_key: os.environ/AWS_SECRET_ACCESS_KEY
      aws_region_name: us-east-1
    model_info:
      description: "Kimi Moonshot v1 via AWS Bedrock"

  # Local llama.cpp Edge Nodes (configured via setup script)
  # Models are dynamically added based on LLAMA_CPP_EDGE_NODES env var
  # Example edge node model config (template):
  # - model_name: llama-3.1-8b-local
  #   litellm_params:
  #     model: openai/llama-3.1-8b-instruct
  #     api_base: http://edge-node-hostname:8080/v1

# MCP Servers Configuration
mcp_servers:
  brave_search:
    url: "http://brave-search-mcp:8080/mcp"
    transport: "http"
    auth_type: "none"
